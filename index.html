<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalkulator CRM V3 (Anti-Blank)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- CSS ASLI V3 --- */
        :root {
            --primary: #3b82f6; --primary-dark: #2563eb; --primary-soft: #eff6ff;
            --bg-color: #f1f5f9; --card-bg: #ffffff; --text-dark: #1e293b;
            --text-gray: #64748b; --success: #10b981; --success-soft: #d1fae5;
            --warning: #f59e0b; --warning-soft: #fef3c7; --danger: #ef4444;
            --danger-soft: #fee2e2; --radius: 16px; --radius-sm: 12px;
            --shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.05);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-dark); margin: 0; padding: 0; min-height: 100vh; line-height: 1.5; }
        .container { width: 100%; max-width: 550px; margin: 0 auto; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }
        h1, h2, h3 { font-family: 'Poppins', sans-serif; margin: 0; color: var(--text-dark); }
        
        /* LAYAR LOGIN (PENTING: Defaultnya FLEX agar TIDAK BLANK) */
        #loginScreen {
            flex: 1; display: flex; /* <-- INI KUNCINYA AGAR TIDAK BLANK */
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 30px 25px; background: var(--card-bg);
            border-radius: var(--radius); box-shadow: var(--shadow); margin-top: 20px; margin-bottom: 20px;
        }
        
        #dashboard { display: none; padding-bottom: 60px; }

        /* MODAL & OVERLAY */
        #qrOverlay, #exitScreen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: #ffffff; }
        #exitScreen { background: #f1f5f9; z-index: 10000; }
        .pulse-icon { font-size: 4rem; margin-bottom: 20px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }

        /* UI COMPONENTS ASLI */
        .icon-circle { width: 70px; height: 70px; background: var(--primary-soft); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .icon-circle svg { width: 40px; height: 40px; }
        
        .login-note { background: var(--danger-soft); color: #b91c1c; padding: 8px 15px; border-radius: 50px; font-size: 0.85rem; font-weight: 600; margin-bottom: 30px; display: inline-flex; align-items: center; gap: 8px; }
        
        .pin-wrapper input { font-family: 'Poppins', monospace; font-size: 2.2rem; width: 100%; max-width: 280px; text-align: center; letter-spacing: 12px; padding: 15px; border: 2px solid #e2e8f0; border-radius: var(--radius); background: #f8fafc; color: var(--text-dark); outline: none; text-transform: uppercase; }
        .btn-main { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; border: none; padding: 18px; border-radius: 50px; font-weight: 600; font-size: 1rem; width: 100%; cursor: pointer; box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25); margin-top: 20px; }
        
        .header-card { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; padding: 24px; border-radius: var(--radius); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-start; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4); }
        .store-badge { background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; }
        .btn-logout { background: rgba(255,255,255,0.9); color: var(--danger); border: none; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }

        .card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 15px; border: 1px solid #f1f5f9; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: flex; align-items: center; font-size: 0.85rem; font-weight: 600; color: var(--text-gray); margin-bottom: 8px; text-transform: uppercase; }
        input { width: 100%; padding: 14px 16px; border: 1px solid #e2e8f0; border-radius: var(--radius-sm); font-size: 1rem; background: #f8fafc; outline: none; }
        .input-with-btn { display: flex; gap: 10px; }
        .btn-add { background: var(--bg-color); color: var(--primary); border: 1px solid #e2e8f0; width: 55px; border-radius: var(--radius-sm); font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .highlight-card { background: var(--primary-soft); border: 1px solid #bfdbfe; }
        #total_sales { background: white; border-color: #93c5fd; color: var(--primary-dark); font-weight: 700; font-size: 1.4rem; text-align: center; }
        
        .summary-card { background: #1e293b; color: white; text-align: center; padding: 25px; position: relative; overflow: hidden; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.95rem; opacity: 0.9; }
        .status-box { padding: 15px; border-radius: 12px; font-weight: 700; font-size: 1.1rem; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .status-ok { background: var(--success); color: white; }
        .status-plus { background: #3b82f6; color: white; }
        .status-min { background: var(--danger); color: white; }
        
        .btn-action { width: 100%; padding: 18px; border: none; border-radius: var(--radius); font-weight: 700; font-size: 1rem; cursor: pointer; color: white; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-blue { background: #0ea5e9; } .btn-green { background: var(--success); } .btn-yellow { background: var(--warning); color: #78350f; } .btn-wa { background: #25D366; display:none; }
        
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px 25px; border-radius: 24px; width: 85%; max-width: 350px; text-align: center; }
        .calc-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .check-tertelan-wrapper { display: inline-flex; align-items: center; margin-left: 8px; background: #f1f5f9; padding: 2px 8px; border-radius: 6px; border: 1px solid #cbd5e1; }
    </style>
</head>

<script>
    // --- SUPABASE CONFIG ---
    const SUPABASE_URL = 'https://mpzxceuhnuhuhuveppmh.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wenhjZXVobnVoaHV2dmVwcG1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgyNjQwNDEsImV4cCI6MjA4Mzg0MDA0MX0.sIRvchXgTH9kEMCqhuM2geYohe1TiipYgxz3PQ_y4R0';
    let supabase = null;

    const scriptURL = 'https://script.google.com/macros/s/AKfycbzX8YNW9U6fyuCzBOWB_lcu7FDJS5ivTOI5RU2QBAVQz-sW_ov4ys_CSuqxQNnYDQLT/exec'; 
    const MAX_RADIUS_METERS = 40; 
    let currentStoreCode = "";
    let dataStore = {}; 
    let activeField = "";
    let onConfirmAction = null;
    let currentLoadedDate = "";

    function getTodayDate() {
        let today = new Date();
        return `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    }
    function getYesterdayDate() {
        let d = new Date(); d.setDate(d.getDate() - 1);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    // --- INISIALISASI ---
    window.addEventListener('load', function() {
        // Init Supabase
        try { supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) { console.error("Supabase Error", e); }

        getDetailedDeviceInfo();
        if(localStorage.getItem('crm_sender_phone')) document.getElementById('nomor_pengirim').value = localStorage.getItem('crm_sender_phone');
        document.getElementById('tgl').value = getYesterdayDate();
        hitungGlobal();
        
        const urlParams = new URLSearchParams(window.location.search);
        const qrKode = urlParams.get('kode');
        if (qrKode) {
            document.getElementById('qrOverlay').style.display = 'flex';
            document.getElementById('inputKode').value = qrKode.toUpperCase();
            setTimeout(() => doLogin(true, true), 500);
        } else {
            let sess = localStorage.getItem('crm_sess');
            if(sess) {
                let p = sess.split('|');
                masukDashboard(p[0], p[1], p[2] || "Toko");
                doLogin(true, true);
            } else {
                document.getElementById('loginScreen').style.display = 'flex'; // Agar tidak blank
            }
        }
    });

    async function doLogin(bypassGPS = false, isSilent = false) {
        const k = document.getElementById('inputKode').value.toUpperCase().trim();
        if(!k) return alert("Isi Kode!");
        if(k==='COBA') return masukDashboard('COBA','TEST','Toko Uji Coba');

        if(!isSilent) document.getElementById('gpsStatus').innerText = "⏳ Mengecek server...";

        try {
            const res = await fetch(scriptURL + "?action=get_shop_info&kode=" + k);
            const shop = await res.json();
            if(shop.error) throw new Error(shop.error);
            masukDashboard(k, k, shop.nama);
        } catch(e) {
            if(!isSilent) {
                alert("Gagal koneksi. Menggunakan mode darurat.");
                masukDashboard(k, k, "Toko " + k);
            }
        }
    }

    function masukDashboard(kode, disp, nama) {
        currentStoreCode = kode;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('qrOverlay').style.display = 'none'; 
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('displayKode').innerText = disp;
        document.getElementById('displayNama').innerText = nama;
        document.getElementById('nama_toko').value = nama;
        localStorage.setItem('crm_sess', kode + '|' + disp + '|' + nama);
        initForm(); loadDraft();
    }

    function logout() { localStorage.removeItem('crm_sess'); location.reload(); }

    function initForm() {
        const fieldsFisik = [
            {id:'setor_sore', label:'☀️ Setor Sore', desc:'Sales H-1'},
            {id:'setor_malam', label:'🌙 Setor Malam', desc:'21.00-24.00'},
            {id:'setor_pagi', label:'🌅 Setor Pagi', desc:'24.00-Selesai'},
            {id:'ekor_sales', label:'🪙 Ekor Sales', hasNote: true, desc:'Transfer M-Banking'}
        ];
        const fieldsPotong = [
            {id:'pot_ba', label:'⚠️ Potongan BA', desc:'Varian'},
            {id:'pot_lebih', label:'➕ Potongan Lebih', isTertelanOption: true, desc:'Tertelan/Lebih'},
            {id:'pot_virtual', label:'💳 Potongan Virtual', desc:'Koreksi'}
        ];
        let html = `<div class="card"><div class="section-title t-fisik"><span>💵</span> Uang Fisik</div>`;
        fieldsFisik.forEach(f => html += createFieldHtml(f));
        html += `</div><div class="card"><div class="section-title t-potong"><span>✂️</span> Potongan</div>`;
        fieldsPotong.forEach(f => html += createFieldHtml(f));
        html += `</div>`;
        document.getElementById('dynamicInputs').innerHTML = html;
    }

    function createFieldHtml(f) {
        if (!dataStore[f.id]) dataStore[f.id] = [];
        let note = f.hasNote ? `<input type="text" id="note_ekor" placeholder="Ket. Ekor" oninput="document.getElementById('val_nama_ekor').value=this.value; autoSaveDraft();" style="margin-top:10px; border:1px dashed #cbd5e1;">` : '';
        let chk = f.isTertelanOption ? `<div class="check-tertelan-wrapper"><input type="checkbox" id="check_tertelan" onchange="autoSaveDraft()"><label for="check_tertelan" style="margin-left:5px; font-size:0.8rem;">Tertelan?</label></div>` : '';
        return `<div class="form-group"><label>${f.label} ${chk}</label><div class="input-with-btn"><input type="text" id="view_${f.id}" value="Rp 0" readonly><button class="btn-add" onclick="openCalc('${f.id}','${f.label}')">+</button></div>${note}</div>`;
    }

    // --- MODIFIKASI: FUNGSI SUBMIT KE SUPABASE ---
    async function processSubmit() {
        const btn = document.getElementById('btn-submit');
        const status = document.getElementById('status');
        if (!document.getElementById('tgl').value) return alert("Pilih Tanggal!");
        
        btn.disabled = true; btn.innerText = "⏳ Menyimpan ke Database...";

        const dataSales = {
            kode_toko: currentStoreCode,
            nama_toko: document.getElementById('nama_toko').value,
            tgl_sales: document.getElementById('tgl').value,
            total_sales: getCleanNumber(document.getElementById('total_sales').value),
            total_fisik: Number(document.getElementById('h_total_fisik').value),
            total_potongan: Number(document.getElementById('disp_total_potong').innerText.replace(/\D/g,'')),
            selisih: Number(document.getElementById('val_selisih').value),
            pengirim: document.getElementById('nomor_pengirim').value
        };

        try {
            await supabase.from('rincian_sales').delete().eq('kode_toko', currentStoreCode).eq('tgl_sales', dataSales.tgl_sales);
            const { error: err1 } = await supabase.from('laporan_sales').upsert(dataSales, { onConflict: 'kode_toko, tgl_sales' });
            if(err1) throw err1;

            let rincianPayload = [];
            const mapLabel = {'setor_sore':'Setor Sore', 'setor_malam':'Setor Malam', 'setor_pagi':'Setor Pagi', 'ekor_sales':'Ekor Sales', 'pot_ba':'Potongan BA', 'pot_lebih':'Potongan Lebih', 'pot_virtual':'Potongan Virtual'};
            
            for (let key in dataStore) {
                if (dataStore[key].length > 0) {
                    dataStore[key].forEach(val => {
                        if(val > 0) {
                            let ket = "";
                            if(key === 'ekor_sales') ket = document.getElementById('val_nama_ekor').value;
                            if(key === 'pot_lebih' && document.getElementById('check_tertelan').checked) ket = "Tertelan";
                            rincianPayload.push({
                                kode_toko: currentStoreCode, tgl_sales: dataSales.tgl_sales,
                                kategori: mapLabel[key], nominal: val, keterangan: ket, cek_manual_saldo: null
                            });
                        }
                    });
                }
            }

            if(rincianPayload.length > 0) {
                const { error: err2 } = await supabase.from('rincian_sales').insert(rincianPayload);
                if(err2) throw err2;
            }

            status.innerText = "✅ Tersimpan!";
            const delData = new FormData(); delData.append('action', 'delete_draft'); delData.append('Kode Toko', currentStoreCode);
            fetch(scriptURL, { method: 'POST', body: delData }); 
            setTimeout(() => { kirimWA(); }, 800);

        } catch (err) {
            alert("Gagal Database: " + err.message);
            btn.disabled = false; btn.innerText = "Coba Lagi";
        }
    }

    // --- FUNGSI ASLI LAINNYA (TIDAK DIUBAH) ---
    function openCalc(id, t) { activeField=id; document.getElementById('modalTitle').innerText=t; document.getElementById('calcModal').style.display='flex'; renderCalcRows(); }
    function renderCalcRows() {
        const c = document.getElementById('calcList'); c.innerHTML="";
        (dataStore[activeField]||[]).forEach((v,i) => {
            c.innerHTML += `<div class="calc-row"><input type="text" class="calc-input" value="${v===0?'':v.toLocaleString('id-ID')}" onkeyup="formatRibuan(this);updateModalTotal()" onblur="handleBlur(this)"><button class="btn-remove" onclick="removeRow(${i})">✕</button></div>`;
        });
        updateModalTotal();
    }
    function addCalcRow() { if(!dataStore[activeField]) dataStore[activeField]=[]; dataStore[activeField].push(0); renderCalcRows(); }
    function removeRow(i) { dataStore[activeField].splice(i,1); renderCalcRows(); updateModalTotal(); }
    function updateModalTotal() { 
        let t=0; document.querySelectorAll('.calc-input').forEach(i=>t+=getCleanNumber(i.value)); 
        document.getElementById('modalTotal').innerText="Rp "+t.toLocaleString('id-ID'); 
    }
    function handleBlur(el) { saveTemp(); }
    function saveTemp() { dataStore[activeField] = Array.from(document.querySelectorAll('.calc-input')).map(i=>getCleanNumber(i.value)); }
    function saveCalculator() {
        saveTemp(); let t = dataStore[activeField].reduce((a,b)=>a+b,0);
        document.getElementById('view_'+activeField).value="Rp "+t.toLocaleString('id-ID');
        document.getElementById('h_'+activeField).value=t;
        document.getElementById('calcModal').style.display='none'; hitungGlobal();
    }
    function hitungGlobal() {
        let sales = getCleanNumber(document.getElementById('total_sales').value);
        let fisik = 0, potong = 0;
        ['setor_sore','setor_malam','setor_pagi','ekor_sales'].forEach(k => fisik += Number(document.getElementById('h_'+k)?.value||0));
        ['pot_ba','pot_lebih','pot_virtual'].forEach(k => potong += Number(document.getElementById('h_'+k)?.value||0));
        
        document.getElementById('disp_total_fisik').innerText = "Rp " + fisik.toLocaleString('id-ID');
        document.getElementById('disp_total_potong').innerText = "Rp " + potong.toLocaleString('id-ID');
        document.getElementById('h_total_fisik').value = fisik;
        
        let selisih = (fisik + potong) - sales;
        document.getElementById('val_selisih').value = selisih;
        
        let el = document.getElementById('disp_balance');
        let btn = document.getElementById('btn-submit');
        
        if (selisih === 0) {
            el.innerHTML = "✅ BALANCE"; el.className = "status-box status-ok";
            btn.className = "btn-action btn-green"; btn.innerText = "💾 SIMPAN (BALANCE)";
        } else if (selisih < 0) {
            el.innerHTML = "⚠️ KURANG Rp " + Math.abs(selisih).toLocaleString('id-ID'); el.className = "status-box status-min";
            btn.className = "btn-action btn-yellow"; btn.innerText = "⚠️ SIMPAN (MINUS)";
        } else {
            el.innerHTML = "➕ LEBIH Rp " + selisih.toLocaleString('id-ID'); el.className = "status-box status-plus";
            btn.className = "btn-action btn-blue"; btn.innerText = "ℹ️ SIMPAN (LEBIH)";
        }
        autoSaveDraft();
    }
    function kirimWA() {
        let tgl = formatDateIndo(document.getElementById('tgl').value);
        let selisih = Number(document.getElementById('val_selisih').value);
        let stat = selisih===0 ? "BALANCE OK ✅" : (selisih>0 ? "LEBIH (+) ⚠️" : "KURANG (-) ⚠️");
        let txt = `*LAPORAN SALES*\n*${currentStoreCode} - ${document.getElementById('nama_toko').value}*\nTgl: ${tgl}\nSales: Rp ${document.getElementById('total_sales').value}\n\n*STATUS: ${stat}*\nSelisih: Rp ${selisih.toLocaleString('id-ID')}\n\nPengirim: ${document.getElementById('nomor_pengirim').value}`;
        window.open(`https://wa.me/6285183347653?text=${encodeURIComponent(txt)}`, '_blank');
        location.reload();
    }
    function formatRibuan(e) { let val = e.value.replace(/[^0-9]/g, ''); e.value = val ? Number(val).toLocaleString('id-ID') : ''; }
    function getCleanNumber(v) { return Number(v.toString().replace(/\./g,'').replace(/\D/g,'')) || 0; }
    function formatDateIndo(d) { if(!d) return ""; let p = d.split('-'); return `${p[2]}-${p[1]}-${p[0]}`; }
    function getDetailedDeviceInfo() { document.getElementById('info_perangkat').value = navigator.userAgent; }
    function autoSaveDraft() { if(!currentStoreCode) return; const fd = new FormData(); fd.append('action','save_draft'); fd.append('Kode Toko',currentStoreCode); fd.append('draft_data',JSON.stringify(collectDraftData())); fetch(scriptURL,{method:'POST',body:fd}); }
    function loadDraft() {
        document.getElementById('historyList').style.display='block'; document.getElementById('historyList').innerText="🔄 Cek Draft...";
        fetch(scriptURL+"?action=load_draft&kode="+currentStoreCode).then(r=>r.json()).then(d=>{
            if(d.total_sales) {
                document.getElementById('tgl').value=d.tgl; document.getElementById('total_sales').value=d.total_sales;
                dataStore = d.dataStore||{}; 
                for(let k in dataStore) {
                    let v = (dataStore[k]||[]).reduce((a,b)=>a+b,0);
                    if(document.getElementById('h_'+k)) document.getElementById('h_'+k).value = v;
                    if(document.getElementById('view_'+k)) document.getElementById('view_'+k).value = "Rp " + v.toLocaleString('id-ID');
                }
                hitungGlobal(); document.getElementById('historyList').innerText="✅ Draft Pulih";
            } else document.getElementById('historyList').style.display='none';
        }).catch(e=>document.getElementById('historyList').style.display='none');
    }
    function collectDraftData() {
        return {
            tgl: document.getElementById('tgl').value,
            nama_toko: document.getElementById('nama_toko').value,
            total_sales: document.getElementById('total_sales').value,
            dataStore: dataStore,
            ekor_note: document.getElementById('val_nama_ekor').value,
            h_setor_sore: document.getElementById('h_setor_sore').value,
            h_setor_malam: document.getElementById('h_setor_malam').value,
            h_setor_pagi: document.getElementById('h_setor_pagi').value,
            h_ekor_sales: document.getElementById('h_ekor_sales').value,
            h_pot_ba: document.getElementById('h_pot_ba').value,
            h_pot_lebih: document.getElementById('h_pot_lebih').value,
            h_pot_virtual: document.getElementById('h_pot_virtual').value,
            is_tertelan: document.getElementById('check_tertelan') ? document.getElementById('check_tertelan').checked : false
        };
    }
    function confirmDeleteDraft() { if(confirm("Hapus?")) { const fd=new FormData(); fd.append('action','delete_draft'); fd.append('Kode Toko',currentStoreCode); fetch(scriptURL,{method:'POST',body:fd}).then(()=>location.reload()); } }
    function saveSender(v) { localStorage.setItem('crm_sender_phone', v); }
    function showAlert(t,m){ document.getElementById('alertTitle').innerText=t; document.getElementById('alertMsg').innerText=m; document.getElementById('alertModal').style.display='flex'; }
    function showConfirm(t,m,d,c){ document.getElementById('confirmTitle').innerText=t; document.getElementById('confirmMsg').innerText=m; onConfirmAction=c; document.getElementById('confirmModal').style.display='flex'; }
    function closeConfirm(){ document.getElementById('confirmModal').style.display='none'; }
    function doConfirmYes(){ if(onConfirmAction) onConfirmAction(); closeConfirm(); }
    function validateDateChange() { autoSaveDraft(); }
</script>
</body>
