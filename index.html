<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Laporan Sales (Auto Plus/Minus)</title>
    <style>
        /* --- CSS Global --- */
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; }
        .container { max-width: 500px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); min-height: 80vh; }
        
        /* --- LOGIN SCREEN --- */
        #loginScreen { text-align: center; padding-top: 50px; }
        .login-box input { font-size: 2rem; width: 150px; text-align: center; letter-spacing: 5px; padding: 10px; border-radius: 10px; border: 2px solid #007bff; text-transform: uppercase; }
        .btn-login { background: #007bff; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 1.1rem; cursor: pointer; margin-top: 20px; width: 100%; max-width: 200px; }

        /* --- DASHBOARD (FORM) --- */
        #dashboard { display: none; } 
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .store-badge { background: #007bff; color: white; padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 0.9rem; }
        
        /* --- History Section --- */
        .history-box { background: #fff3cd; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ffeeba; display: none; }

        /* --- Form Elements --- */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #444; font-size: 0.9rem; }
        input[type="text"], input[type="date"], input[type="number"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        
        .input-group { display: flex; gap: 5px; }
        .btn-calc { background: #17a2b8; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; }

        /* --- Summary --- */
        .summary { background: #e8f4fc; padding: 15px; border-radius: 8px; margin-top: 20px; }
        
        /* Indikator Balance Baru */
        .balance-ok { color: green; font-weight: bold; } /* Pas */
        .balance-plus { color: #0056b3; font-weight: bold; } /* Lebih (Biru) */
        .balance-min { color: #dc3545; font-weight: bold; } /* Kurang (Merah) */

        /* --- Buttons --- */
        .btn-action { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 1rem; }
        .btn-save { background: #28a745; color: white; }
        .btn-wa { background: #25D366; color: white; display: none; } 

        /* --- Modal Calculator --- */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; }
        .calc-row { display: flex; gap: 5px; margin-bottom: 5px; }
        .calc-row input { flex:1; padding: 8px;}
        .btn-remove { background: #dc3545; color: white; border: none; border-radius: 5px; width: 30px; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="loginScreen">
        <h2>🔒 Login Toko</h2>
        <p>Masukkan 4 digit kode toko:</p>
        <div class="login-box">
            <input type="text" id="inputKode" maxlength="4" placeholder="ABCD">
        </div>
        <button class="btn-login" onclick="doLogin()">MASUK</button>
        <p id="loginError" style="color:red; display:none;">Kode harus 4 karakter!</p>
        <p id="gpsStatus" style="font-size:0.8rem; color:#666; margin-top:20px;"></p>
    </div>

    <div id="dashboard">
        <div class="header-bar">
            <div>
                <span class="store-badge" id="displayKode">CODE</span>
                <span id="displayNama" style="font-weight:bold; margin-left:5px;">Laporan Sales</span> 
            </div>
            <button onclick="logout()" style="background:none; border:none; color:red; cursor:pointer;">Keluar</button>
        </div>

        <button type="button" onclick="deleteDraft()" style="background:#dc3545; color:white; border:none; padding:8px 15px; border-radius:5px; width:100%; margin-bottom:10px; cursor:pointer; font-size:0.8rem;">🗑️ HAPUS DRAF CLOUD</button>
        
        <div id="historyPanel" class="history-box">
            <div id="historyList">Loading...</div>
        </div>

        <form id="salesForm">
            <input type="hidden" name="Kode Toko" id="formKode">
            
            <div class="form-group">
                <label>Tanggal</label>
                <input type="date" name="Tanggal" id="tgl" required onchange="autoSaveDraft()">
            </div>
            <div class="form-group">
                <label>Nama Toko</label>
                <input type="text" name="Nama Toko" id="nama_toko" placeholder="Nama Toko Diisi Otomatis" required readonly style="background:#f8f9fa;"> 
            </div>

            <div class="form-group">
                <label>TOTAL SALES SYSTEM (Rp)</label>
                <input type="text" inputmode="numeric" name="Total Sales" id="total_sales" placeholder="0" onkeyup="formatRibuan(this); hitungGlobal();" style="background:#fff3cd; font-weight:bold;">
            </div>

            <div id="dynamicInputs"></div>

            <div class="summary">
                <div>Total Fisik: <span id="disp_total_fisik">Rp 0</span></div>
                <div>Total Potongan: <span id="disp_total_potong">Rp 0</span></div>
                <hr>
                <div>Status: <span id="disp_balance">0</span></div>
            </div>

            <input type="hidden" name="Setor Sore" id="h_setor_sore" value="0">
            <input type="hidden" name="Setor Malam" id="h_setor_malam" value="0">
            <input type="hidden" name="Setor Pagi" id="h_setor_pagi" value="0">
            <input type="hidden" name="Ekor Sales" id="h_ekor_sales" value="0">
            <input type="hidden" name="Potongan BA" id="h_pot_ba" value="0">
            <input type="hidden" name="Potongan Lebih" id="h_pot_lebih" value="0">
            <input type="hidden" name="Potongan Virtual" id="h_pot_virtual" value="0">
            <input type="hidden" name="Total Setor Fisik" id="h_total_fisik" value="0">
            <input type="hidden" id="val_nama_ekor">
            <input type="hidden" id="val_selisih" value="0">

            <button type="button" class="btn-action btn-save" id="btn-submit" onclick="submitForm()">💾 SIMPAN FINAL</button>
            <button type="button" class="btn-action btn-wa" id="btn-wa" onclick="kirimWA()">📲 KIRIM WA</button>
            <p id="status" style="text-align:center; margin-top:5px; font-weight:bold;"></p>
        </form>
    </div>
</div>

<div id="calcModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Rincian</h3>
        <div id="calcList" style="max-height:200px; overflow-y:auto; margin-bottom:10px;"></div>
        <button onclick="addCalcRow()" style="background:#6c757d; color:white; border:none; padding:5px; cursor:pointer;">+ Tambah Nominal</button>
        <div style="text-align:right; margin-top:10px;">Total: <strong id="modalTotal">0</strong></div>
        <button onclick="saveCalculator()" style="width:100%; background:#007bff; color:white; padding:10px; margin-top:10px; border:none; border-radius:5px; cursor:pointer;">Simpan</button>
        <button onclick="document.getElementById('calcModal').style.display='none'" style="width:100%; background:transparent; border:none; margin-top:5px; color:#666; cursor:pointer;">Batal</button>
    </div>
</div>

<script>
    // === KONFIGURASI ===
    // Ganti dengan Link Apps Script Anda
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzX8YNW9U6fyuCzBOWB_lcu7FDJS5ivTOI5RU2QBAVQz-sW_ov4ys_CSuqxQNnYDQLT/exec'; 
    const MAX_RADIUS_METERS = 150; 

    let currentStoreCode = "";
    let dataStore = {}; 
    let activeField = "";

    // === UTILS ===
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000; const toRad = (x) => x * Math.PI / 180;
        const dLat = toRad(lat2 - lat1); const dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); return R * c; 
    }

    function formatRibuan(element) {
        let val = element.value.replace(/[^,\d]/g, '').toString();
        let split = val.split(',');
        let sisa = split[0].length % 3;
        let rupiah = split[0].substr(0, sisa);
        let ribuan = split[0].substr(sisa).match(/\d{3}/gi);
        if (ribuan) { let separator = sisa ? '.' : ''; rupiah += separator + ribuan.join('.'); }
        rupiah = split[1] != undefined ? rupiah + ',' + split[1] : rupiah;
        element.value = rupiah;
        if (element.id === 'total_sales') autoSaveDraft(); 
    }

    function getCleanNumber(val) {
        if (!val) return 0;
        return Number(val.toString().replace(/\./g, '')) || 0; 
    }

    // === DRAFT LOGIC ===
    function collectDraftData() {
        return {
            tgl: document.getElementById('tgl').value,
            nama_toko: document.getElementById('nama_toko').value,
            total_sales: document.getElementById('total_sales').value,
            dataStore: dataStore,
            ekor_note: document.getElementById('val_nama_ekor').value,
            h_setor_sore: document.getElementById('h_setor_sore').value,
            h_setor_malam: document.getElementById('h_setor_malam').value,
            h_setor_pagi: document.getElementById('h_setor_pagi').value,
            h_ekor_sales: document.getElementById('h_ekor_sales').value,
            h_pot_ba: document.getElementById('h_pot_ba').value,
            h_pot_lebih: document.getElementById('h_pot_lebih').value,
            h_pot_virtual: document.getElementById('h_pot_virtual').value,
        };
    }

    function autoSaveDraft() {
        if (!currentStoreCode) return;
        const formData = new FormData();
        formData.append('action', 'save_draft');
        formData.append('Kode Toko', currentStoreCode);
        formData.append('draft_data', JSON.stringify(collectDraftData()));
        fetch(scriptURL, { method: 'POST', body: formData }).catch(e => console.log("Autosave err"));
    }

    function loadDraft() {
        const historyList = document.getElementById('historyList');
        document.getElementById('historyPanel').style.display = 'block';
        historyList.innerHTML = `Mengecek draf...`;

        const timestamp = new Date().getTime();
        fetch(scriptURL + "?action=load_draft&kode=" + currentStoreCode + "&tmp=" + timestamp)
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    historyList.innerHTML = `Mulai baru.`;
                    dataStore = {}; initForm();
                } else {
                    const draft = data;
                    document.getElementById('tgl').value = draft.tgl || new Date().toISOString().substring(0, 10);
                    document.getElementById('total_sales').value = draft.total_sales || '';
                    document.getElementById('val_nama_ekor').value = draft.ekor_note || '';

                    if (typeof draft.dataStore === 'string') {
                        try { dataStore = JSON.parse(draft.dataStore); } catch(e) { dataStore = {}; }
                    } else { dataStore = draft.dataStore || {}; }

                    ['setor_sore', 'setor_malam', 'setor_pagi', 'ekor_sales', 'pot_ba', 'pot_lebih', 'pot_virtual'].forEach(key => {
                        document.getElementById('h_' + key).value = draft['h_' + key] || 0;
                    });

                    initForm(); 
                    if(document.getElementById('note_ekor')) document.getElementById('note_ekor').value = draft.ekor_note || '';
                    updateAllViewFields(); 
                    historyList.innerHTML = `<span style="color:green; font-weight:bold;">✅ Draf Cloud (${draft.tgl})</span>`;
                }
            }).catch(e => { historyList.innerHTML = "Gagal Load."; initForm(); });
    }

    function deleteDraft() {
        if (!confirm("Hapus draf?")) return;
        const form = new FormData(); form.append('action', 'delete_draft'); form.append('Kode Toko', currentStoreCode);
        fetch(scriptURL, { method: 'POST', body: form }).then(() => location.reload());
    }

    function updateAllViewFields() {
        ['setor_sore', 'setor_malam', 'setor_pagi', 'ekor_sales', 'pot_ba', 'pot_lebih', 'pot_virtual'].forEach(id => {
            let val = Number(document.getElementById('h_' + id).value) || 0;
            if(document.getElementById('view_'+id)) document.getElementById('view_'+id).value = "Rp " + val.toLocaleString('id-ID');
        });
        hitungGlobal();
    }

    // === LOGIN ===
    async function doLogin() {
        const code = document.getElementById('inputKode').value.toUpperCase().trim();
        if (code.length !== 4) return alert("Kode salah");
        
        document.getElementById('gpsStatus').innerText = "Cek Lokasi...";
        try {
            const res = await fetch(scriptURL + "?action=get_shop_info&kode=" + code + "&t=" + new Date().getTime());
            const shop = await res.json();
            if (shop.error) throw new Error(shop.error);

            navigator.geolocation.getCurrentPosition(pos => {
                const dist = calculateDistance(pos.coords.latitude, pos.coords.longitude, shop.lat, shop.lon);
                if (dist > MAX_RADIUS_METERS) return alert(`Jarak Terlalu Jauh (${Math.round(dist)}m).`);
                
                currentStoreCode = code;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('displayKode').innerText = code;
                document.getElementById('formKode').value = code;
                document.getElementById('nama_toko').value = shop.nama;
                loadDraft();
            }, () => alert("GPS Gagal/Mati."));
        } catch(e) { alert("Error: " + e.message); }
    }
    function logout() { location.reload(); }

    // === FORM & CALC ===
    function initForm() {
        const fields = [
            {id:'setor_sore', label:'Setor Sore ☀️'}, {id:'setor_malam', label:'Setor Malam 🌙'}, {id:'setor_pagi', label:'Setor Pagi (H+1) 🌅'},
            {id:'ekor_sales', label:'Ekor Sales 🪙', hasNote: true}, {id:'pot_ba', label:'Potongan BA Var ⚠️'}, {id:'pot_lebih', label:'Potongan Lebih ➕'}, {id:'pot_virtual', label:'Potongan Virtual 💳'}
        ];
        let html = "";
        fields.forEach(f => {
            if (!dataStore[f.id]) dataStore[f.id] = [];
            let ekorVal = (f.id==='ekor_sales') ? document.getElementById('val_nama_ekor').value : '';
            html += `<div class="form-group"><label>${f.label}</label><div class="input-group"><input type="text" id="view_${f.id}" value="Rp 0" readonly style="background:#fff;"><button type="button" class="btn-calc" onclick="openCalc('${f.id}', '${f.label}')">➕</button></div>${f.hasNote?'<input type="text" id="note_ekor" placeholder="Ket Ekor" value="'+ekorVal+'" onchange="document.getElementById(`val_nama_ekor`).value=this.value; autoSaveDraft();" style="margin-top:5px;">':''}</div>`;
        });
        document.getElementById('dynamicInputs').innerHTML = html;
    }

    function openCalc(id, title) { activeField=id; document.getElementById('modalTitle').innerText=title; document.getElementById('calcModal').style.display='flex'; renderCalcRows(); updateModalTotal(); }
    function renderCalcRows() {
        const c = document.getElementById('calcList'); c.innerHTML="";
        let vals = dataStore[activeField]||[]; if(vals.length===0) vals.push(0);
        vals.forEach((v,i) => {
            c.innerHTML += `<div class="calc-row"><input type="text" inputmode="numeric" class="calc-input" value="${v===0?'':v.toLocaleString('id-ID')}" onkeyup="formatRibuan(this);updateModalTotal()"><button class="btn-remove" onclick="removeRow(${i})">&times;</button></div>`;
        });
    }
    function addCalcRow() { saveTemp(); dataStore[activeField].push(0); renderCalcRows(); }
    function removeRow(i) { saveTemp(); dataStore[activeField].splice(i,1); renderCalcRows(); updateModalTotal(); }
    function saveTemp() { dataStore[activeField] = Array.from(document.querySelectorAll('.calc-input')).map(i=>getCleanNumber(i.value)); }
    function updateModalTotal() { 
        let t=0; document.querySelectorAll('.calc-input').forEach(i=>t+=getCleanNumber(i.value)); 
        document.getElementById('modalTotal').innerText="Rp "+t.toLocaleString('id-ID'); 
    }
    function saveCalculator() {
        saveTemp(); let t = dataStore[activeField].reduce((a,b)=>a+b,0);
        document.getElementById('view_'+activeField).value="Rp "+t.toLocaleString('id-ID');
        document.getElementById('h_'+activeField).value=t;
        document.getElementById('calcModal').style.display='none'; hitungGlobal();
    }

    // === LOGIKA HITUNG (MODIFIKASI: PLUS = AMAN) ===
    function hitungGlobal() {
        let sales = getCleanNumber(document.getElementById('total_sales').value);
        let fisik = Number(document.getElementById('h_setor_sore').value) + Number(document.getElementById('h_setor_malam').value) + Number(document.getElementById('h_setor_pagi').value) + Number(document.getElementById('h_ekor_sales').value);
        let potong = Number(document.getElementById('h_pot_ba').value) + Number(document.getElementById('h_pot_lebih').value) + Number(document.getElementById('h_pot_virtual').value);

        document.getElementById('disp_total_fisik').innerText = "Rp " + fisik.toLocaleString('id-ID');
        document.getElementById('disp_total_potong').innerText = "Rp " + potong.toLocaleString('id-ID');
        document.getElementById('h_total_fisik').value = fisik;

        // RUMUS: (Fisik + Potong) - Sales
        // Hasil Positif = LEBIH (Aman)
        // Hasil Negatif = KURANG (Bahaya)
        let selisih = (fisik + potong) - sales;
        document.getElementById('val_selisih').value = selisih;

        let elBal = document.getElementById('disp_balance');
        
        if (selisih === 0) {
            elBal.innerText = "BALANCE OK ✅"; 
            elBal.className = "balance-ok";
        } else if (selisih > 0) {
            // Kondisi LEBIH / PLUS
            elBal.innerText = "LEBIH (+) Rp " + selisih.toLocaleString('id-ID');
            elBal.className = "balance-plus";
        } else {
            // Kondisi KURANG / MINUS
            elBal.innerText = "KURANG (-) Rp " + Math.abs(selisih).toLocaleString('id-ID');
            elBal.className = "balance-min";
        }
        
        autoSaveDraft();
    }

    // === SUBMIT LOGIC (MODIFIKASI: BOLEH PLUS) ===
    function submitForm() {
        const btn = document.getElementById('btn-submit');
        const status = document.getElementById('status');
        
        let selisih = Number(document.getElementById('val_selisih').value);
        let realSales = getCleanNumber(document.getElementById('total_sales').value);

        // ATURAN: Hanya tolak jika KURANG (Negatif)
        // Jika Pas (0) atau Lebih (>0), boleh simpan.
        if (selisih < 0) {
            autoSaveDraft();
            alert(`⚠️ UANG KURANG (Minus Rp ${Math.abs(selisih).toLocaleString('id-ID')}).\n\nData hanya disimpan di DRAF. Tidak bisa Final.`);
            status.innerText = "⚠️ Draf Tersimpan (Status: Kurang)";
            status.style.color = "red";
            return;
        }

        let confirmMsg = (selisih > 0) 
            ? `Ada KELEBIHAN uang Rp ${selisih.toLocaleString('id-ID')}.\nTetap Simpan Final?`
            : "Data BALANCE OK. Simpan Final?";

        if (!confirm(confirmMsg)) return;

        btn.disabled = true; btn.innerText = "Menyimpan...";
        
        const form = document.getElementById('salesForm');
        const formData = new FormData(form);
        formData.set('action', 'submit_final'); 
        formData.set('Total Sales', realSales);
        formData.set('Tanggal', document.getElementById('tgl').value);

        fetch(scriptURL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if (data.result === "success") {
                     status.innerText = "✅ Tersimpan Final!"; status.style.color = "green";
                     btn.style.display = 'none'; document.getElementById('btn-wa').style.display = 'block';
                     const delData = new FormData(); delData.append('action', 'delete_draft'); delData.append('Kode Toko', currentStoreCode);
                     fetch(scriptURL, { method: 'POST', body: delData }); 
                     alert("Berhasil!");
                } else { throw new Error(data.error); }
            })
            .catch(err => {
                status.innerText = "Gagal: " + err.message;
                btn.disabled = false; btn.innerText = "💾 SIMPAN FINAL";
            });
    }

    function kirimWA() {
        let getVal = (id) => document.getElementById('view_'+id).value;
        let selisih = Number(document.getElementById('val_selisih').value);
        
        // Tentukan teks status untuk WA
        let statusTxt = "";
        if (selisih === 0) statusTxt = "BALANCE OK ✅";
        else if (selisih > 0) statusTxt = `LEBIH (+) Rp ${selisih.toLocaleString('id-ID')} ⚠️`;
        else statusTxt = `KURANG (-) Rp ${Math.abs(selisih).toLocaleString('id-ID')} ❌`;

        let ekorTxt = getVal('ekor_sales');
        if(document.getElementById('val_nama_ekor').value) ekorTxt += ` (a.n ${document.getElementById('val_nama_ekor').value})`;

        let txt = `*LAPORAN SALES HARIAN*\n*Toko:* ${document.getElementById('nama_toko').value}\n*Tgl:* ${document.getElementById('tgl').value}\n------------------\n*Omzet:* Rp ${document.getElementById('total_sales').value}\n\n*Fisik:*\n1. Sore: ${getVal('setor_sore')}\n2. Malam: ${getVal('setor_malam')}\n3. Pagi: ${getVal('setor_pagi')}\n4. Ekor: ${ekorTxt}\n------------------ (+)\n*Total Fisik: ${document.getElementById('disp_total_fisik').innerText}*\n\n*Potongan:*\n1. BA Var: ${getVal('pot_ba')}\n2. Lebih: ${getVal('pot_lebih')}\n3. Virtual: ${getVal('pot_virtual')}\n------------------ (+)\n*Total Potong: ${document.getElementById('disp_total_potong').innerText}*\n\n------------------\n*${statusTxt}*`;
        
        window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
    }
</script>
</body>
</html>
