<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Report Sales CRM</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        
        :root {
            --primary: #4f46e5; 
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-dark: #1f2937;
            --text-gray: #6b7280;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius: 16px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0; padding: 0;
            min-height: 100vh;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3 { family: 'Poppins', sans-serif; margin: 0; }
        
        
        #loginScreen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-top: 20px;
        }
        
        #loginScreen h2 { color: var(--primary); font-size: 1.5rem; margin-bottom: 10px; }
        .login-note { background: #fee2e2; color: #b91c1c; padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; margin-bottom: 30px; display: inline-block;}

        .pin-wrapper { margin: 20px 0; position: relative; }
        .pin-wrapper input {
            font-family: 'Poppins', monospace;
            font-size: 2rem;
            width: 200px;
            text-align: center;
            letter-spacing: 10px;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: #f9fafb;
            transition: all 0.3s ease;
            outline: none;
            color: var(--primary);
            text-transform: uppercase;
        }
        .pin-wrapper input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); background: white; }

        .btn-main {
            background: var(--primary); color: white; border: none;
            padding: 16px; border-radius: 50px; font-weight: 600;
            font-size: 1rem; width: 100%; cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: transform 0.2s;
        }
        .btn-main:active { transform: scale(0.98); }

        
        #dashboard { display: none; padding-bottom: 50px; }
        
        .header-card {
            background: var(--primary);
            color: white;
            padding: 20px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .store-badge { background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 8px; font-size: 0.8rem; margin-right: 5px; }
        .btn-logout { background: white; color: var(--danger); border: none; padding: 8px 15px; border-radius: 20px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }

       
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 15px;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-size: 0.85rem; font-weight: 600;
            color: var(--text-gray); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        
        input[type="text"], input[type="date"], input[type="tel"], input[type="number"] {
            width: 100%; padding: 14px;
            border: 1px solid #e5e7eb; border-radius: 12px;
            font-size: 1rem; color: var(--text-dark); background: #f9fafb;
            font-family: 'Inter', sans-serif; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); background: white; }
        
        #total_sales {
            background: #eff6ff; border-color: #bfdbfe;
            color: var(--primary); font-weight: 700; font-size: 1.2rem;
        }

        .input-with-btn { display: flex; gap: 8px; }
        .btn-add {
            background: #e0e7ff; color: var(--primary); border: none;
            width: 50px; border-radius: 12px; font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* --- SUMMARY & STATUS --- */
        .summary-card {
            background: #1f2937; color: white;
            text-align: center; padding: 25px;
        }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; opacity: 0.9; }
        .summary-divider { height: 1px; background: rgba(255,255,255,0.2); margin: 15px 0; }
        
        .status-box {
            padding: 10px; border-radius: 10px; font-weight: 700; font-size: 1.1rem; margin-top: 10px;
            display: block;
        }
        .status-ok { background: var(--success); color: white; }
        .status-plus { background: #3b82f6; color: white; }
        .status-min { background: var(--danger); color: white; }

        /* --- TOMBOL AKSI --- */
        .btn-draft { background: var(--danger); color: white; width: 100%; padding: 12px; border:none; border-radius: 12px; margin-bottom: 15px; font-weight:600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;}
        
        .btn-action {
            width: 100%; padding: 18px; border: none; border-radius: 16px;
            font-weight: 700; font-size: 1rem; cursor: pointer;
            color: white; margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .btn-green { background: var(--success); }
        .btn-yellow { background: var(--warning); color: #fff; }
        .btn-wa { background: #25D366; display: none; margin-top:15px;}

        
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 320px; animation: popUp 0.3s ease; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center;}
        @keyframes popUp { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .modal-icon { font-size: 2.5rem; margin-bottom: 10px; display: block; }
        .modal-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 10px; color: var(--text-dark); font-family: 'Poppins', sans-serif;}
        .modal-text { color: var(--text-gray); font-size: 0.95rem; margin-bottom: 20px; line-height: 1.5; }
        
        .modal-footer { margin-top: 20px; display: flex; gap: 10px; }
        .btn-modal-primary { flex: 1; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; }
        .btn-modal-danger { flex: 1; background: var(--danger); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; }
        .btn-modal-cancel { flex: 1; background: transparent; color: var(--text-gray); border: 1px solid #e5e7eb; border-radius: 10px; cursor: pointer; font-weight: 500;}
        
        
        .calc-row { display: flex; gap: 10px; margin-bottom: 10px; text-align: left;}
        .calc-input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .btn-remove { background: #fee2e2; color: var(--danger); border: none; width: 40px; border-radius: 8px; cursor: pointer; }
        
        
        .hidden { display: none; }
        #historyList { font-size: 0.85rem; color: #4b5563; padding: 10px; background: #fffbeb; border-radius: 8px; margin-bottom: 15px; border: 1px solid #fcd34d; display: none;}
    </style>
</head>
<body>

<div class="container">
    
    <div id="loginScreen">
        <div style="margin-bottom: 20px;">
            <div style="width: 60px; height: 60px; background: #e0e7ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px;">
                <span style="font-size: 30px;">🏪</span>
            </div>
            <h2>Report Sales Metode CRM</h2>
            <p style="color: var(--text-gray); margin: 0;">Silakan masuk dengan Kode Toko</p>
        </div>
        <div class="login-note">📍 Wajib berada di lokasi toko</div>
        <div class="pin-wrapper">
            <input type="text" id="inputKode" maxlength="4" placeholder="CODE">
        </div>
        <button class="btn-main" onclick="doLogin()">MASUK SEKARANG</button>
        <p id="loginError" style="color:var(--danger); display:none; margin-top:15px; font-weight:600;">Kode Salah!</p>
        <p id="gpsStatus" style="font-size:0.8rem; color:var(--text-gray); margin-top:20px;">Menunggu GPS...</p>
    </div>

    <div id="dashboard">
        <div class="header-card">
            <div class="store-info">
                <div><span class="store-badge" id="displayKode">CODE</span></div>
                <h2 id="displayNama">Nama Toko</h2>
                <span style="font-size:0.8rem; opacity:0.8;">Input Laporan Harian</span>
            </div>
            <button class="btn-logout" onclick="logout()">Keluar</button>
        </div>

        <div id="historyList">Loading...</div>
        <button type="button" class="btn-draft" onclick="confirmDeleteDraft()">
            <span>🗑️</span> Hapus Draf Cloud
        </button>

        <form id="salesForm">
            <input type="hidden" name="Kode Toko" id="formKode">
            
            <div class="card">
                <div class="form-group">
                    <label>📅 Tanggal Laporan</label>
                    <input type="date" name="Tanggal" id="tgl" required onchange="autoSaveDraft()">
                </div>
                <div class="form-group">
                    <label>🏪 Nama Toko</label>
                    <input type="text" name="Nama Toko" id="nama_toko" readonly style="background:#f3f4f6; color:#6b7280;"> 
                </div>
                <div class="form-group">
                    <label>📱 WA Pengirim</label>
                    <input type="tel" id="nomor_pengirim" placeholder="Contoh: 0812xxxx" onchange="saveSender(this.value)">
                </div>
            </div>

            <div class="card" style="border-left: 5px solid var(--primary);">
                <div class="form-group" style="margin-bottom:0;">
                    <label style="color:var(--primary);">💰 TOTAL SALES SYSTEM (Rp)</label>
                    <input type="text" inputmode="numeric" name="Total Sales" id="total_sales" placeholder="0" onkeyup="formatRibuan(this); hitungGlobal();">
                </div>
            </div>

            <div id="dynamicInputs"></div>

            <div class="card summary-card">
                <div class="summary-row"><span>Total Fisik</span><span id="disp_total_fisik" style="font-weight:600;">Rp 0</span></div>
                <div class="summary-row"><span>Total Potongan</span><span id="disp_total_potong" style="font-weight:600;">Rp 0</span></div>
                <div class="summary-divider"></div>
                <div style="font-size: 0.9rem; opacity: 0.8;">Status Balance:</div>
                <div id="disp_balance" class="status-box status-ok">0</div>
            </div>

            <input type="hidden" name="Setor Sore" id="h_setor_sore" value="0">
            <input type="hidden" name="Setor Malam" id="h_setor_malam" value="0">
            <input type="hidden" name="Setor Pagi" id="h_setor_pagi" value="0">
            <input type="hidden" name="Ekor Sales" id="h_ekor_sales" value="0">
            <input type="hidden" name="Potongan BA" id="h_pot_ba" value="0">
            <input type="hidden" name="Potongan Lebih" id="h_pot_lebih" value="0">
            <input type="hidden" name="Potongan Virtual" id="h_pot_virtual" value="0">
            <input type="hidden" name="Total Setor Fisik" id="h_total_fisik" value="0">
            <input type="hidden" name="Ket Ekor" id="val_nama_ekor"> 
            <input type="hidden" id="val_selisih" value="0">

            <button type="button" class="btn-action btn-green" id="btn-submit" onclick="trySubmitForm()">💾 SIMPAN FINAL</button>
            <button type="button" class="btn-action btn-wa" id="btn-wa" onclick="kirimWA()">📲 KIRIM KE WA</button>
            
            <p id="status" style="text-align:center; margin-top:15px; font-weight:bold; color:var(--text-gray);"></p>
        </form>
    </div>
</div>

<div id="confirmModal" class="modal">
    <div class="modal-content">
        <span id="confirmIcon" class="modal-icon">⚠️</span>
        <div id="confirmTitle" class="modal-title">Konfirmasi</div>
        <div id="confirmMsg" class="modal-text">Pesan konfirmasi...</div>
        <div class="modal-footer">
            <button class="btn-modal-cancel" onclick="closeConfirm()">Batal</button>
            <button id="btnConfirmYes" class="btn-modal-primary" onclick="doConfirmYes()">Ya, Lanjutkan</button>
        </div>
    </div>
</div>

<div id="alertModal" class="modal">
    <div class="modal-content">
        <span class="modal-icon">ℹ️</span>
        <div class="modal-title" id="alertTitle">Info</div>
        <div class="modal-text" id="alertMsg">Message</div>
        <button class="btn-modal-primary" style="width:100%" onclick="document.getElementById('alertModal').style.display='none'">OK</button>
    </div>
</div>

<div id="calcModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle" style="margin-bottom:15px; color:var(--primary);">Rincian</h3>
        <div id="calcList" style="max-height:200px; overflow-y:auto; margin-bottom:15px;"></div>
        <button onclick="addCalcRow()" style="background:#f3f4f6; color:var(--text-dark); border:1px dashed #ccc; padding:8px; width:100%; border-radius:8px; cursor:pointer;">+ Tambah Baris</button>
        <div style="text-align:right; margin-top:15px; font-size:1.1rem;">Total: <strong id="modalTotal" style="color:var(--primary);">0</strong></div>
        <div class="modal-footer">
            <button class="btn-modal-cancel" onclick="document.getElementById('calcModal').style.display='none'">Batal</button>
            <button class="btn-modal-primary" onclick="saveCalculator()">Simpan</button>
        </div>
    </div>
</div>

<script>
  
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzX8YNW9U6fyuCzBOWB_lcu7FDJS5ivTOI5RU2QBAVQz-sW_ov4ys_CSuqxQNnYDQLT/exec'; 
    const MAX_RADIUS_METERS = 150; 

    let currentStoreCode = "";
    let dataStore = {}; 
    let activeField = "";
    

    let onConfirmAction = null;


    function showAlert(title, msg) {
        document.getElementById('alertTitle').innerText = title;
        document.getElementById('alertMsg').innerText = msg;
        document.getElementById('alertModal').style.display = 'flex';
    }

    function showConfirm(title, msg, isDanger, callback) {
        document.getElementById('confirmTitle').innerText = title;
        document.getElementById('confirmMsg').innerText = msg;
        
        let btn = document.getElementById('btnConfirmYes');
        if (isDanger) {
            btn.className = "btn-modal-danger";
            btn.innerText = "Ya, Hapus";
            document.getElementById('confirmIcon').innerText = "🗑️";
        } else {
            btn.className = "btn-modal-primary";
            btn.innerText = "Ya, Simpan";
            document.getElementById('confirmIcon').innerText = "💾";
        }

        onConfirmAction = callback;
        document.getElementById('confirmModal').style.display = 'flex';
    }

    function closeConfirm() {
        document.getElementById('confirmModal').style.display = 'none';
        onConfirmAction = null;
    }

    function doConfirmYes() {
        if (onConfirmAction) onConfirmAction();
        closeConfirm();
    }

    // === septa ===
    window.addEventListener('load', function() {
        let savedNum = localStorage.getItem('crm_sender_phone');
        if(savedNum && document.getElementById('nomor_pengirim')) {
            document.getElementById('nomor_pengirim').value = savedNum;
        }
    });

    function saveSender(val) { localStorage.setItem('crm_sender_phone', val); }

    function formatDateIndo(dateString) {
        if (!dateString) return "";
        let parts = dateString.split('-'); 
        if (parts.length !== 3) return dateString;
        return `${parts[2]}-${parts[1]}-${parts[0]}`; 
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000; const toRad = (x) => x * Math.PI / 180;
        const dLat = toRad(lat2 - lat1); const dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); return R * c; 
    }

    function formatRibuan(element) {
        let val = element.value.replace(/[^,\d]/g, '').toString();
        let split = val.split(',');
        let sisa = split[0].length % 3;
        let rupiah = split[0].substr(0, sisa);
        let ribuan = split[0].substr(sisa).match(/\d{3}/gi);
        if (ribuan) { let separator = sisa ? '.' : ''; rupiah += separator + ribuan.join('.'); }
        rupiah = split[1] != undefined ? rupiah + ',' + split[1] : rupiah;
        element.value = rupiah;
        if (element.id === 'total_sales') autoSaveDraft(); 
    }

    function getCleanNumber(val) {
        if (!val) return 0;
        return Number(val.toString().replace(/\./g, '')) || 0; 
    }

    // === DRAFT LOGIC ===
    function collectDraftData() {
        return {
            tgl: document.getElementById('tgl').value,
            nama_toko: document.getElementById('nama_toko').value,
            total_sales: document.getElementById('total_sales').value,
            dataStore: dataStore,
            ekor_note: document.getElementById('val_nama_ekor').value,
            h_setor_sore: document.getElementById('h_setor_sore').value,
            h_setor_malam: document.getElementById('h_setor_malam').value,
            h_setor_pagi: document.getElementById('h_setor_pagi').value,
            h_ekor_sales: document.getElementById('h_ekor_sales').value,
            h_pot_ba: document.getElementById('h_pot_ba').value,
            h_pot_lebih: document.getElementById('h_pot_lebih').value,
            h_pot_virtual: document.getElementById('h_pot_virtual').value,
        };
    }

    function autoSaveDraft() {
        if (!currentStoreCode) return;
        const formData = new FormData();
        formData.append('action', 'save_draft');
        formData.append('Kode Toko', currentStoreCode);
        formData.append('draft_data', JSON.stringify(collectDraftData()));
        fetch(scriptURL, { method: 'POST', body: formData }).catch(e => console.log("Autosave err"));
    }

    function loadDraft() {
        const historyList = document.getElementById('historyList');
        document.getElementById('historyList').style.display = 'block';
        historyList.innerHTML = `Mengecek draf cloud...`;

        const timestamp = new Date().getTime();
        fetch(scriptURL + "?action=load_draft&kode=" + currentStoreCode + "&tmp=" + timestamp)
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    historyList.style.display = 'none';
                    dataStore = {}; initForm();
                } else {
                    const draft = data;
                    document.getElementById('tgl').value = draft.tgl || new Date().toISOString().substring(0, 10);
                    document.getElementById('total_sales').value = draft.total_sales || '';
                    document.getElementById('val_nama_ekor').value = draft.ekor_note || '';

                    if (typeof draft.dataStore === 'string') {
                        try { dataStore = JSON.parse(draft.dataStore); } catch(e) { dataStore = {}; }
                    } else { dataStore = draft.dataStore || {}; }

                    ['setor_sore', 'setor_malam', 'setor_pagi', 'ekor_sales', 'pot_ba', 'pot_lebih', 'pot_virtual'].forEach(key => {
                        document.getElementById('h_' + key).value = draft['h_' + key] || 0;
                    });

                    initForm(); 
                    if(document.getElementById('note_ekor')) document.getElementById('note_ekor').value = draft.ekor_note || '';
                    updateAllViewFields(); 
                    
                    let tglIndo = formatDateIndo(draft.tgl);
                    historyList.style.display = 'block';
                    historyList.innerHTML = `<span style="color:green; font-weight:bold;">✅ Data Dipulihkan dari Cloud (${tglIndo})</span>`;
                }
            }).catch(e => { historyList.style.display = 'none'; initForm(); });
    }

    function confirmDeleteDraft() {
        showConfirm("Hapus Draf?", "Data draf di cloud akan dihapus permanen.", true, function() {
            const form = new FormData(); form.append('action', 'delete_draft'); form.append('Kode Toko', currentStoreCode);
            fetch(scriptURL, { method: 'POST', body: form }).then(() => location.reload());
        });
    }

    function updateAllViewFields() {
        ['setor_sore', 'setor_malam', 'setor_pagi', 'ekor_sales', 'pot_ba', 'pot_lebih', 'pot_virtual'].forEach(id => {
            let val = Number(document.getElementById('h_' + id).value) || 0;
            if(document.getElementById('view_'+id)) document.getElementById('view_'+id).value = "Rp " + val.toLocaleString('id-ID');
        });
        hitungGlobal();
    }


    async function doLogin() {
        const code = document.getElementById('inputKode').value.toUpperCase().trim();
        if (code.length !== 4) return showAlert("Gagal", "Kode harus 4 karakter");
        
        document.getElementById('gpsStatus').innerText = "Sedang melacak lokasi...";
        try {
            const res = await fetch(scriptURL + "?action=get_shop_info&kode=" + code + "&t=" + new Date().getTime());
            const shop = await res.json();
            if (shop.error) throw new Error(shop.error);

            navigator.geolocation.getCurrentPosition(pos => {
                const dist = calculateDistance(pos.coords.latitude, pos.coords.longitude, shop.lat, shop.lon);
                if (dist > MAX_RADIUS_METERS) return showAlert("Lokasi Jauh", `Anda berjarak ${Math.round(dist)}m dari toko.`);
                
                currentStoreCode = code;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('displayKode').innerText = code;
                document.getElementById('formKode').value = code;
                document.getElementById('displayNama').innerText = shop.nama;
                document.getElementById('nama_toko').value = shop.nama;
                loadDraft();
            }, () => showAlert("GPS Mati", "Mohon aktifkan GPS/Lokasi di HP Anda."));
        } catch(e) { showAlert("Login Gagal", e.message); }
    }
    function logout() { location.reload(); }


    function initForm() {
        const fieldsFisik = [
            {id:'setor_sore', label:'Setor Sore ☀️'}, {id:'setor_malam', label:'Setor Malam 🌙'}, {id:'setor_pagi', label:'Setor Pagi (H+1) 🌅'},
            {id:'ekor_sales', label:'Ekor Sales 🪙', hasNote: true}
        ];
        const fieldsPotong = [
            {id:'pot_ba', label:'Potongan BA Var ⚠️'}, {id:'pot_lebih', label:'Potongan Lebih ➕'}, {id:'pot_virtual', label:'Potongan Virtual 💳'}
        ];

        let html = "";
        html += `<div class="card"><h3 style="margin-bottom:15px; font-size:1rem; color:var(--primary);">💵 Uang Fisik</h3>`;
        fieldsFisik.forEach(f => html += createFieldHtml(f));
        html += `</div>`;
        html += `<div class="card"><h3 style="margin-bottom:15px; font-size:1rem; color:var(--danger);">✂️ Potongan</h3>`;
        fieldsPotong.forEach(f => html += createFieldHtml(f));
        html += `</div>`;
        document.getElementById('dynamicInputs').innerHTML = html;
    }

    function createFieldHtml(f) {
        if (!dataStore[f.id]) dataStore[f.id] = [];
        let ekorVal = (f.id==='ekor_sales') ? document.getElementById('val_nama_ekor').value : '';
        let noteInput = f.hasNote 
            ? `<input type="text" id="note_ekor" placeholder="Keterangan Ekor (Misal: BCA Budi)" value="${ekorVal}" oninput="document.getElementById('val_nama_ekor').value=this.value; autoSaveDraft();" style="margin-top:8px; border:1px dashed #ccc;">` 
            : '';
        return `<div class="form-group"><label>${f.label}</label><div class="input-with-btn"><input type="text" id="view_${f.id}" value="Rp 0" readonly style="background:#fff;"><button type="button" class="btn-add" onclick="openCalc('${f.id}', '${f.label}')">+</button></div>${noteInput}</div>`;
    }

    function openCalc(id, title) { activeField=id; document.getElementById('modalTitle').innerText=title; document.getElementById('calcModal').style.display='flex'; renderCalcRows(); updateModalTotal(); }
    function renderCalcRows() {
        const c = document.getElementById('calcList'); c.innerHTML="";
        let vals = dataStore[activeField]||[]; if(vals.length===0) vals.push(0);
        vals.forEach((v,i) => {
            c.innerHTML += `<div class="calc-row"><input type="text" inputmode="numeric" class="calc-input" value="${v===0?'':v.toLocaleString('id-ID')}" onkeyup="formatRibuan(this);updateModalTotal()"><button class="btn-remove" onclick="removeRow(${i})">X</button></div>`;
        });
    }
    function addCalcRow() { saveTemp(); dataStore[activeField].push(0); renderCalcRows(); }
    function removeRow(i) { saveTemp(); dataStore[activeField].splice(i,1); renderCalcRows(); updateModalTotal(); }
    function saveTemp() { dataStore[activeField] = Array.from(document.querySelectorAll('.calc-input')).map(i=>getCleanNumber(i.value)); }
    function updateModalTotal() { 
        let t=0; document.querySelectorAll('.calc-input').forEach(i=>t+=getCleanNumber(i.value)); 
        document.getElementById('modalTotal').innerText="Rp "+t.toLocaleString('id-ID'); 
    }
    function saveCalculator() {
        saveTemp(); let t = dataStore[activeField].reduce((a,b)=>a+b,0);
        document.getElementById('view_'+activeField).value="Rp "+t.toLocaleString('id-ID');
        document.getElementById('h_'+activeField).value=t;
        document.getElementById('calcModal').style.display='none'; hitungGlobal();
    }

  
    function hitungGlobal() {
        let sales = getCleanNumber(document.getElementById('total_sales').value);
        let fisik = Number(document.getElementById('h_setor_sore').value) + Number(document.getElementById('h_setor_malam').value) + Number(document.getElementById('h_setor_pagi').value) + Number(document.getElementById('h_ekor_sales').value);
        let potong = Number(document.getElementById('h_pot_ba').value) + Number(document.getElementById('h_pot_lebih').value) + Number(document.getElementById('h_pot_virtual').value);

        document.getElementById('disp_total_fisik').innerText = "Rp " + fisik.toLocaleString('id-ID');
        document.getElementById('disp_total_potong').innerText = "Rp " + potong.toLocaleString('id-ID');
        document.getElementById('h_total_fisik').value = fisik;

        let selisih = (fisik + potong) - sales;
        document.getElementById('val_selisih').value = selisih;

        let elBal = document.getElementById('disp_balance');
        let btn = document.getElementById('btn-submit');
        elBal.classList.remove('status-ok', 'status-plus', 'status-min');

        if (selisih < 0) {
            elBal.innerText = "KURANG (-) Rp " + Math.abs(selisih).toLocaleString('id-ID');
            elBal.classList.add('status-min');
            btn.innerText = "⚠️ SIMPAN DRAFT (MINUS)";
            btn.className = "btn-action btn-yellow";
        } else {
            if (selisih === 0) {
                elBal.innerText = "BALANCE (PAS) ✅"; 
                elBal.classList.add('status-ok');
            } else {
                elBal.innerText = "LEBIH (+) Rp " + selisih.toLocaleString('id-ID');
                elBal.classList.add('status-plus');
            }
            btn.innerText = "💾 SIMPAN FINAL";
            btn.className = "btn-action btn-green";
        }
        autoSaveDraft();
    }


    function trySubmitForm() {
        let selisih = Number(document.getElementById('val_selisih').value);
        

        if (selisih < 0) {
            autoSaveDraft();
            showAlert("Data Kurang", `Data masih minus Rp ${Math.abs(selisih).toLocaleString('id-ID')}. Telah disimpan di Draf.`);
            return; 
        }


        let msg = (selisih > 0) 
            ? `Ada KELEBIHAN uang Rp ${selisih.toLocaleString('id-ID')}. Tetap simpan?`
            : "Data BALANCE OK. Simpan laporan final?";

        showConfirm("Konfirmasi Simpan", msg, false, function() {
            processSubmit();
        });
    }

    function processSubmit() {
        const btn = document.getElementById('btn-submit');
        const status = document.getElementById('status');
        
        btn.disabled = true; btn.innerText = "Sedang Mengirim...";
        
        const form = document.getElementById('salesForm');
        const formData = new FormData(form);
        formData.set('action', 'submit_final'); 
        formData.set('Total Sales', getCleanNumber(document.getElementById('total_sales').value));
        formData.set('Tanggal', formatDateIndo(document.getElementById('tgl').value)); 
        
        formData.set('Ket Ekor', document.getElementById('val_nama_ekor').value);
        formData.set('Pengirim', document.getElementById('nomor_pengirim').value);

        fetch(scriptURL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if (data.result === "success") {
                     status.innerText = "✅ Laporan Berhasil!"; status.style.color = "var(--success)";
                     btn.style.display = 'none'; document.getElementById('btn-wa').style.display = 'block';
                     const delData = new FormData(); delData.append('action', 'delete_draft'); delData.append('Kode Toko', currentStoreCode);
                     fetch(scriptURL, { method: 'POST', body: delData }); 
                     
                     showAlert("Berhasil!", "Laporan Final telah tersimpan.");
                } else { throw new Error(data.error); }
            })
            .catch(err => {
                status.innerText = "Gagal: " + err.message;
                btn.disabled = false; btn.innerText = "💾 SIMPAN FINAL";
                showAlert("Error", "Gagal mengirim data. Coba lagi.");
            });
    }

    function kirimWA() {
        let getVal = (id) => document.getElementById('view_'+id).value;
        let selisih = Number(document.getElementById('val_selisih').value);
        
        let kode = document.getElementById('formKode').value || currentStoreCode;
        let nama = document.getElementById('nama_toko').value;
        let pengirim = document.getElementById('nomor_pengirim').value || "-"; 
        let rawTgl = document.getElementById('tgl').value;
        let tglIndo = formatDateIndo(rawTgl); 
        
        saveSender(pengirim);

        let statusTxt = "";
        if (selisih === 0) statusTxt = "BALANCE OK ✅"; 
        else if (selisih > 0) statusTxt = `LEBIH (+) Rp ${selisih.toLocaleString('id-ID')}⚠️`;
        else statusTxt = `KURANG (-) Rp ${Math.abs(selisih).toLocaleString('id-ID')}⚠️`;

        let ekorTxt = getVal('ekor_sales');
        if(document.getElementById('val_nama_ekor').value) ekorTxt += ` (a.n ${document.getElementById('val_nama_ekor').value})`;

        let txt = `*LAPORAN SETOR SALES*\n$*{kode} - ${nama}*\n*Tgl Sales:* ${tglIndo}\n*Total Sales:* Rp ${document.getElementById('total_sales').value}\n------------------\n*Fisik Setor:*\n1. Sore: ${getVal('setor_sore')}\n2. Malam: ${getVal('setor_malam')}\n3. Pagi: ${getVal('setor_pagi')}\n4. Ekor: ${ekorTxt}\n------------------ (+)\n*Total Setor: ${document.getElementById('disp_total_fisik').innerText}*\n\n*Potongan:*\n1. BA Var: ${getVal('pot_ba')}\n2. Lebih: ${getVal('pot_lebih')}\n3. Virtual: ${getVal('pot_virtual')}\n------------------ (+)\n*Total Potong: ${document.getElementById('disp_total_potong').innerText}*\n\n------------------\n*${statusTxt}*\n\n👤 *Pengirim:* ${pengirim}`;
        
        window.open(`https://wa.me/6285183347653?text=${encodeURIComponent(txt)}`, '_blank');
    }
</script>
