<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengalihkan Sistem...</title>
    <script>
        var linkBaru = "https://setor-atm-idm.vercel.app/";
        window.location.replace(linkBaru + window.location.search);
    </script>
    <style>
        body {
            background-color: #f1f5f9;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #334155;
            text-align: center;
            padding: 20px;
        }
        .loader {
            border: 4px solid #cbd5e1;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h3>Memperbarui Sistem...</h3>
    <p style="font-size: 12px; color: #64748b;">Mengarahkan ke server baru. Jika tidak berpindah, <a id="linkManual" href="#" style="color: #3b82f6;">klik di sini</a>.</p>
    
    <script>
        document.getElementById('linkManual').href = linkBaru + window.location.search;
    </script>
</body>
</html>
