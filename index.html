<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Report Sales CRM</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #3b82f6; --primary-dark: #2563eb; --primary-soft: #eff6ff;
            --bg-color: #f1f5f9; --card-bg: #ffffff;
            --text-dark: #1e293b; --text-gray: #64748b;
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --danger-soft: #fee2e2;
            --radius: 16px; --radius-sm: 12px; --shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.05);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-dark); margin: 0; padding: 0; min-height: 100vh; line-height: 1.5; }
        .container { width: 100%; max-width: 550px; margin: 0 auto; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }
        h1, h2, h3 { family: 'Poppins', sans-serif; margin: 0; color: var(--text-dark); }
        
        #loginScreen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 30px 25px; background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); margin: 20px 0; }
        .icon-circle { width: 70px; height: 70px; background: var(--primary-soft); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 32px; color: var(--primary); }
        .login-note { background: var(--danger-soft); color: #b91c1c; padding: 12px 20px; border-radius: 50px; font-size: 0.85rem; font-weight: 600; margin-bottom: 30px; display: inline-flex; align-items: center; gap: 8px; }
        .pin-wrapper input { font-family: 'Poppins', monospace; font-size: 2.2rem; width: 100%; max-width: 280px; text-align: center; letter-spacing: 12px; padding: 15px; border: 2px solid #e2e8f0; border-radius: var(--radius); background: #f8fafc; color: var(--text-dark); transition: all 0.3s ease; outline: none; text-transform: uppercase; }
        .pin-wrapper input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); }
        .btn-main { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; border: none; padding: 18px; border-radius: 50px; font-weight: 600; font-size: 1rem; width: 100%; cursor: pointer; box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25); transition: transform 0.2s; margin-top: 20px; }
        .btn-main:active { transform: scale(0.98); }

        #dashboard { display: none; padding-bottom: 60px; }
        .header-card { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; padding: 24px; border-radius: var(--radius); margin-bottom: 20px; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4); display: flex; justify-content: space-between; align-items: flex-start; }
        .store-badge { background: rgba(255,255,255,0.2); backdrop-filter: blur(5px); padding: 4px 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; display: inline-block; }
        .btn-logout { background: rgba(255,255,255,0.9); color: var(--danger); border: none; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }

        .card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 15px; border: 1px solid #f1f5f9; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-gray); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="text"], input[type="date"], input[type="tel"], input[type="number"] { width: 100%; padding: 14px 16px; border: 1px solid #e2e8f0; border-radius: var(--radius-sm); font-size: 1rem; color: var(--text-dark); background: #f8fafc; font-family: 'Inter', sans-serif; outline: none; transition: 0.3s; -webkit-appearance: none; }
        input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        .highlight-card { background: var(--primary-soft); border: 1px solid #bfdbfe; }
        #total_sales { background: white; border-color: #93c5fd; color: var(--primary-dark); font-weight: 700; font-size: 1.4rem; text-align: center; }
        .input-with-btn { display: flex; gap: 10px; }
        .btn-add { background: var(--bg-color); color: var(--primary); border: 1px solid #e2e8f0; width: 55px; border-radius: var(--radius-sm); font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .summary-card { background: #1e293b; color: white; text-align: center; padding: 25px; position: relative; overflow: hidden; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.95rem; opacity: 0.9; }
        .status-box { padding: 15px; border-radius: 12px; font-weight: 700; font-size: 1.1rem; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .status-ok { background: var(--success); color: white; } .status-plus { background: #3b82f6; color: white; } .status-min { background: var(--danger); color: white; }

        .btn-action { width: 100%; padding: 18px; border: none; border-radius: var(--radius); font-weight: 700; font-size: 1rem; cursor: pointer; color: white; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-green { background: var(--success); } .btn-yellow { background: var(--warning); color: #78350f; } .btn-wa { background: #25D366; display: none; margin-top:15px; }
        
        .draft-controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-draft { background: white; color: var(--text-gray); border: 1px solid #e2e8f0; width: 100%; padding: 12px; border-radius: var(--radius-sm); font-weight:600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.85rem; }
        .btn-draft-save { color: var(--warning); border-color: var(--warning-soft); background: #fffbeb; }
        .btn-draft-del { color: var(--danger); border-color: var(--danger-soft); background: #fef2f2; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px 25px; border-radius: 24px; width: 85%; max-width: 350px; animation: popUp 0.3s ease; text-align: center; }
        @keyframes popUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-footer { margin-top: 20px; display: flex; gap: 12px; }
        .btn-modal-primary, .btn-modal-danger { flex: 1; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .btn-modal-primary { background: var(--primary); } .btn-modal-danger { background: var(--danger); }
        .btn-modal-cancel { flex: 1; background: transparent; color: var(--text-gray); border: 1px solid #e2e8f0; border-radius: 12px; cursor: pointer; font-weight: 600; padding: 14px; }
        
        .calc-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .calc-input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        .section-title { display: flex; align-items: center; gap: 8px; font-size: 1rem; font-weight: 700; margin-bottom: 15px; }
        .t-fisik { color: var(--primary); } .t-potong { color: var(--danger); }
        
        #autoSaveStatus { position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.7); color: white; padding: 8px 15px; border-radius: 20px; font-size: 0.8rem; display: none; z-index: 9999; }
    </style>
</head>
<body>

<div id="autoSaveStatus">Menyimpan draf...</div>

<div class="container">
    <div id="loginScreen">
        <div style="margin-bottom: 20px;">
            <div class="icon-circle"><span>🏪</span></div>
            <h2>Sales Report CRM</h2>
            <p style="color: var(--text-gray); margin: 5px 0 0 0;">Input Laporan Harian</p>
        </div>
        <div class="login-note"><span>📍</span> Wajib berada di lokasi toko</div>
        <div class="pin-wrapper"><input type="text" id="inputKode" maxlength="4" placeholder="KODE" inputmode="text"></div>
        <button class="btn-main" onclick="doLogin()">MASUK SEKARANG</button>
        <p id="loginError" style="color:var(--danger); display:none; margin-top:20px; font-weight:600;">Kode Salah!</p>
        <p id="gpsStatus" style="font-size:0.85rem; color:var(--text-gray); margin-top:25px;">⏳ Menunggu sinyal GPS...</p>
    </div>

    <div id="dashboard">
        <div class="header-card">
            <div class="store-info">
                <span style="font-size:0.8rem; opacity:0.9;">Selamat Datang,</span>
                <h2 id="displayNama">Nama Toko</h2>
                <div style="margin-top: 8px;"><span class="store-badge" id="displayKode">CODE</span></div>
            </div>
            <button class="btn-logout" onclick="logout()">Keluar ➔</button>
        </div>

        <div id="historyList" style="display:none; padding:15px; background:#fffbeb; border-radius:12px; margin-bottom:20px; font-size:0.85rem; color:#b45309;">Loading...</div>
        
        <div class="draft-controls">
            <button type="button" class="btn-draft btn-draft-save" onclick="manualSaveDraft()"><span>💾</span> Simpan Draf</button>
            <button type="button" class="btn-draft btn-draft-del" onclick="confirmDeleteDraft()"><span>🗑️</span> Hapus Draf</button>
        </div>

        <form id="salesForm">
            <input type="hidden" name="Kode Toko" id="formKode">
            
            <div class="card">
                <div class="form-group"><label>📅 Tanggal Sales</label><input type="date" name="Tanggal" id="tgl" required onchange="autoSaveDraft()"></div>
                <div class="form-group"><label>🏪 Nama Toko</label><input type="text" name="Nama Toko" id="nama_toko" readonly style="background:#f1f5f9; color:#64748b; font-weight: 500;"></div>
                <div class="form-group" style="margin-bottom:0;"><label>📱 WA Pengirim</label><input type="tel" id="nomor_pengirim" placeholder="08xxxxxxx" onchange="saveSender(this.value); autoSaveDraft();"></div>
            </div>

            <div class="card highlight-card">
                <div class="form-group" style="margin-bottom:0;"><label style="text-align: center; width: 100%;">💰 TOTAL SALES TUTUPAN (Rp)</label><input type="text" inputmode="numeric" name="Total Sales" id="total_sales" placeholder="0" onkeyup="formatRibuan(this); hitungGlobal();"></div>
            </div>

            <div id="dynamicInputs"></div>

            <div class="card summary-card">
                <div class="summary-row"><span>Total Uang Fisik</span><span id="disp_total_fisik" style="font-weight:600;">Rp 0</span></div>
                <div class="summary-row"><span>Total Potongan</span><span id="disp_total_potong" style="font-weight:600;">Rp 0</span></div>
                <div style="height:1px; background:rgba(255,255,255,0.15); margin:20px 0;"></div>
                <div style="font-size: 0.85rem; opacity: 0.8; margin-bottom: 5px;">Status Akhir:</div>
                <div id="disp_balance" class="status-box status-ok"><span>✅</span> 0</div>
            </div>

            <input type="hidden" name="Setor Sore" id="h_setor_sore" value="0">
            <input type="hidden" name="Setor Malam" id="h_setor_malam" value="0">
            <input type="hidden" name="Setor Pagi" id="h_setor_pagi" value="0">
            <input type="hidden" name="Ekor Sales" id="h_ekor_sales" value="0">
            <input type="hidden" name="Potongan BA" id="h_pot_ba" value="0">
            <input type="hidden" name="Potongan Lebih" id="h_pot_lebih" value="0">
            <input type="hidden" name="Potongan Virtual" id="h_pot_virtual" value="0">
            <input type="hidden" name="Ket Ekor" id="val_nama_ekor"> 
            <input type="hidden" id="val_selisih" value="0">

            <button type="button" class="btn-action btn-green" id="btn-submit" onclick="trySubmitForm()"><span>💾</span> SIMPAN FINAL</button>
            <button type="button" class="btn-action btn-wa" id="btn-wa" onclick="kirimWA()"><span>📲</span> KIRIM KE WHATSAPP</button>
            <p id="status" style="text-align:center; margin-top:20px; font-weight:600; color:var(--text-gray);"></p>
        </form>
    </div>
</div>

<div id="confirmModal" class="modal"><div class="modal-content"><span id="confirmIcon" style="font-size:3rem;">⚠️</span><div id="confirmTitle" class="modal-title">Konfirmasi</div><div id="confirmMsg" class="modal-text">Msg</div><div class="modal-footer"><button class="btn-modal-cancel" onclick="closeConfirm()">Batal</button><button id="btnConfirmYes" class="btn-modal-primary" onclick="doConfirmYes()">Ya</button></div></div></div>
<div id="alertModal" class="modal"><div class="modal-content"><span style="font-size:3rem;">ℹ️</span><div class="modal-title" id="alertTitle">Info</div><div class="modal-text" id="alertMsg">Msg</div><button class="btn-modal-primary" style="width:100%" onclick="document.getElementById('alertModal').style.display='none'">OK</button></div></div>
<div id="calcModal" class="modal"><div class="modal-content"><h3 id="modalTitle" style="margin-bottom:20px; color:var(--primary);">Rincian</h3><div id="calcList" style="max-height:250px; overflow-y:auto; margin-bottom:15px;"></div><button onclick="addCalcRow()" style="background:#f8fafc; color:var(--primary); border:2px dashed #cbd5e1; padding:12px; width:100%; border-radius:12px; font-weight:600; margin-bottom:15px;">+ Tambah Baris</button><div style="background:var(--primary-soft); padding:15px; border-radius:12px; display:flex; justify-content:space-between; margin-bottom:20px;"><span>Total:</span><strong id="modalTotal">0</strong></div><div class="modal-footer"><button class="btn-modal-cancel" onclick="document.getElementById('calcModal').style.display='none'">Batal</button><button class="btn-modal-primary" onclick="saveCalculator()">Simpan</button></div></div></div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzX8YNW9U6fyuCzBOWB_lcu7FDJS5ivTOI5RU2QBAVQz-sW_ov4ys_CSuqxQNnYDQLT/exec'; 
    const MAX_RADIUS_METERS = 30; 

    let currentStoreCode = "";
    let dataStore = {}; 
    let activeField = "";
    let onConfirmAction = null;
    let saveTimeout = null;

    function showAlert(title, msg) { document.getElementById('alertTitle').innerText = title; document.getElementById('alertMsg').innerText = msg; document.getElementById('alertModal').style.display = 'flex'; }
    function showConfirm(title, msg, isDanger, callback) { document.getElementById('confirmTitle').innerText = title; document.getElementById('confirmMsg').innerText = msg; let btn = document.getElementById('btnConfirmYes'); if(isDanger){ btn.className="btn-modal-danger"; btn.innerText="Ya, Hapus"; }else{ btn.className="btn-modal-primary"; btn.innerText="Ya, Simpan"; } onConfirmAction = callback; document.getElementById('confirmModal').style.display = 'flex'; }
    function closeConfirm() { document.getElementById('confirmModal').style.display = 'none'; onConfirmAction = null; }
    function doConfirmYes() { if (onConfirmAction) onConfirmAction(); closeConfirm(); }

    window.addEventListener('load', function() { let savedNum = localStorage.getItem('crm_sender_phone'); if(savedNum && document.getElementById('nomor_pengirim')) { document.getElementById('nomor_pengirim').value = savedNum; } });
    function saveSender(val) { localStorage.setItem('crm_sender_phone', val); }

    async function doLogin() {
        const code = document.getElementById('inputKode').value.toUpperCase().trim();
        if (code.length < 3) return showAlert("Gagal", "Kode terlalu pendek");

        if (code === "COBA") {
            currentStoreCode = "COBA";
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('displayKode').innerText = "TEST";
            document.getElementById('formKode').value = "COBA";
            document.getElementById('displayNama').innerText = "Mode Uji Coba (Tanpa GPS)";
            document.getElementById('nama_toko').value = "Toko Uji Coba";
            loadDraft(); 
            showAlert("Mode Uji Coba", "Anda masuk tanpa verifikasi GPS.");
            return; 
        }

        document.getElementById('gpsStatus').innerText = "Sedang melacak lokasi...";
        try {
            const res = await fetch(scriptURL + "?action=get_shop_info&kode=" + code + "&t=" + new Date().getTime());
            const shop = await res.json();
            if (shop.error) throw new Error(shop.error);

            navigator.geolocation.getCurrentPosition(pos => {
                const dist = calculateDistance(pos.coords.latitude, pos.coords.longitude, shop.lat, shop.lon);
                if (dist > MAX_RADIUS_METERS) return showAlert("Lokasi Jauh", `Anda berjarak ${Math.round(dist)}m dari toko.`);
                
                currentStoreCode = code;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('displayKode').innerText = code;
                document.getElementById('formKode').value = code;
                document.getElementById('displayNama').innerText = shop.nama;
                document.getElementById('nama_toko').value = shop.nama;
                loadDraft();
            }, () => showAlert("GPS Mati", "Mohon aktifkan GPS/Lokasi di HP Anda."));
        } catch(e) { showAlert("Login Gagal", e.message); }
    }
    function logout() { location.reload(); }

    function loadDraft() {
        const hList = document.getElementById('historyList'); 
        hList.style.display = 'block'; 
        hList.innerHTML = `🔄 Mengecek draf cloud...`;
        
        initForm(); 

        fetch(scriptURL + "?action=load_draft&kode=" + currentStoreCode + "&tmp=" + new Date().getTime())
            .then(res => res.json()).then(data => {
                if (data.error) { 
                    hList.style.display = 'none'; 
                    dataStore = {}; 
                    initForm(); 
                } 
                else {
                    const draft = data;
                    document.getElementById('tgl').value = draft.tgl || new Date().toISOString().substring(0, 10);
                    document.getElementById('total_sales').value = draft.total_sales || '';
                    if(draft.pengirim) document.getElementById('nomor_pengirim').value = draft.pengirim;
                    document.getElementById('val_nama_ekor').value = draft.ekor_note || '';

                    if (typeof draft.dataStore === 'string') { try { dataStore = JSON.parse(draft.dataStore); } catch(e) { dataStore = {}; } } else { dataStore = draft.dataStore || {}; }

                    ['setor_sore', 'setor_malam', 'setor_pagi', 'ekor_sales', 'pot_ba', 'pot_lebih', 'pot_virtual'].forEach(key => { 
                        document.getElementById('h_' + key).value = draft['h_' + key] || 0; 
                    });

                    // Update form
                    initForm();
                    updateAllViewFields(); 
                    hitungGlobal();

                    hList.innerHTML = `<span style="color:green; font-weight:bold;">✅ Data Terakhir Dipulihkan</span>`;
                }
            }).catch(e => { hList.style.display = 'none'; initForm(); });
    }

    // --- FUNGSI UPDATE VIEW YANG HILANG SEBELUMNYA ---
    function updateAllViewFields() {
        ['setor_sore', 'setor_malam', 'setor_pagi', 'ekor_sales', 'pot_ba', 'pot_lebih', 'pot_virtual'].forEach(id => {
            let val = Number(document.getElementById('h_' + id).value) || 0;
            if(document.getElementById('view_'+id)) {
                document.getElementById('view_'+id).value = "Rp " + val.toLocaleString('id-ID');
            }
        });
    }

    function initForm() {
        const fFisik = [
            {id:'setor_sore', label:'☀️ Setor Sore'}, 
            {id:'setor_malam', label:'🌙 Setor Malam'}, 
            {id:'setor_pagi', label:'🌅 Setor Pagi (H+1)'}, 
            {id:'ekor_sales', label:'🪙 Ekor Sales', hasNote: true} 
        ];
        const fPotong = [
            {id:'pot_ba', label:'⚠️ Potongan BA Var'}, 
            {id:'pot_lebih', label:'➕ Potongan Lebih'}, 
            {id:'pot_virtual', label:'💳 Potongan Virtual'}
        ];
        
        let html = `<div class="card"><div class="section-title t-fisik"><span>💵</span> Uang Fisik</div>`;
        fFisik.forEach(f => html += createFieldHtml(f));
        html += `</div><div class="card"><div class="section-title t-potong"><span>✂️</span> Potongan</div>`;
        fPotong.forEach(f => html += createFieldHtml(f));
        html += `</div>`;
        document.getElementById('dynamicInputs').innerHTML = html;
    }

    function createFieldHtml(f) {
        if (!dataStore[f.id]) dataStore[f.id] = [];
        let ekorVal = document.getElementById('val_nama_ekor') ? document.getElementById('val_nama_ekor').value : '';
        
        let noteInput = f.hasNote 
            ? `<input type="text" id="note_ekor" placeholder="Ket. Ekor (Misal: BCA Budi)" value="${ekorVal}" oninput="document.getElementById('val_nama_ekor').value=this.value; autoSaveDraft();" style="margin-top:10px; border:1px dashed #cbd5e1; background: #f8fafc;">` 
            : '';
            
        return `<div class="form-group">
                    <label>${f.label}</label>
                    <div class="input-with-btn">
                        <input type="text" id="view_${f.id}" value="Rp 0" readonly style="background:white; cursor: default;">
                        <button type="button" class="btn-add" onclick="openCalc('${f.id}', '${f.label}')">+</button>
                    </div>
                    ${noteInput}
                </div>`;
    }

    function openCalc(id, title) { activeField=id; document.getElementById('modalTitle').innerText=title; document.getElementById('calcModal').style.display='flex'; renderCalcRows(); updateModalTotal(); }
    function renderCalcRows() {
        const c = document.getElementById('calcList'); c.innerHTML=""; let vals = dataStore[activeField]||[]; if(vals.length===0) vals.push(0);
        vals.forEach((v,i) => { c.innerHTML += `<div class="calc-row"><input type="text" inputmode="numeric" class="calc-input" value="${v===0?'':v.toLocaleString('id-ID')}" onkeyup="formatRibuan(this);updateModalTotal()"><button class="btn-remove" onclick="removeRow(${i})">✕</button></div>`; });
    }
    function addCalcRow() { saveTemp(); dataStore[activeField].push(0); renderCalcRows(); }
    function removeRow(i) { saveTemp(); dataStore[activeField].splice(i,1); renderCalcRows(); updateModalTotal(); }
    function saveTemp() { dataStore[activeField] = Array.from(document.querySelectorAll('.calc-input')).map(i=>getCleanNumber(i.value)); }
    function updateModalTotal() { let t=0; document.querySelectorAll('.calc-input').forEach(i=>t+=getCleanNumber(i.value)); document.getElementById('modalTotal').innerText="Rp "+t.toLocaleString('id-ID'); }
    function saveCalculator() { saveTemp(); let t = dataStore[activeField].reduce((a,b)=>a+b,0); document.getElementById('view_'+activeField).value="Rp "+t.toLocaleString('id-ID'); document.getElementById('h_'+activeField).value=t; document.getElementById('calcModal').style.display='none'; hitungGlobal(); }

    function hitungGlobal() {
        let sales = getCleanNumber(document.getElementById('total_sales').value);
        let fisik = Number(document.getElementById('h_setor_sore').value) + Number(document.getElementById('h_setor_malam').value) + Number(document.getElementById('h_setor_pagi').value) + Number(document.getElementById('h_ekor_sales').value);
        let potong = Number(document.getElementById('h_pot_ba').value) + Number(document.getElementById('h_pot_lebih').value) + Number(document.getElementById('h_pot_virtual').value);
        
        document.getElementById('disp_total_fisik').innerText = "Rp " + fisik.toLocaleString('id-ID'); 
        document.getElementById('disp_total_potong').innerText = "Rp " + potong.toLocaleString('id-ID');
        document.getElementById('h_total_fisik').value = fisik;
        
        let selisih = (fisik + potong) - sales; 
        document.getElementById('val_selisih').value = selisih;
        
        let elBal = document.getElementById('disp_balance'); 
        let btn = document.getElementById('btn-submit');
        elBal.classList.remove('status-ok', 'status-plus', 'status-min');
        
        if (selisih < 0) { 
            elBal.innerHTML = `<span>⚠️</span> KURANG (-) Rp ` + Math.abs(selisih).toLocaleString('id-ID'); 
            elBal.classList.add('status-min'); 
            btn.innerHTML = `<span>⚠️</span> SIMPAN DRAFT (MINUS)`; 
            btn.className = "btn-action btn-yellow"; 
        } else { 
            if (selisih === 0) { 
                elBal.innerHTML = `<span>✅</span> BALANCE (PAS)`; 
                elBal.classList.add('status-ok'); 
            } else { 
                elBal.innerHTML = `<span>➕</span> LEBIH (+) Rp ` + selisih.toLocaleString('id-ID'); 
                elBal.classList.add('status-plus'); 
            } 
            btn.innerHTML = `<span>💾</span> SIMPAN FINAL`; 
            btn.className = "btn-action btn-green"; 
        }
        autoSaveDraft();
    }

    function trySubmitForm() {
        let selisih = Number(document.getElementById('val_selisih').value);
        if (selisih < 0) { autoSaveDraft(); showAlert("Data Kurang", `Data masih minus Rp ${Math.abs(selisih).toLocaleString('id-ID')}. Telah disimpan di Draf.`); return; }
        showConfirm("Konfirmasi Simpan", "Data sudah benar?", false, function() { processSubmit(); });
    }

    function processSubmit() {
        const btn = document.getElementById('btn-submit'); const status = document.getElementById('status');
        btn.disabled = true; btn.innerText = "⏳ Sedang Mengirim...";
        const form = document.getElementById('salesForm'); const formData = new FormData(form);
        formData.set('action', 'submit_final'); 
        formData.set('Total Sales', getCleanNumber(document.getElementById('total_sales').value));
        formData.set('Tanggal', formatDateIndo(document.getElementById('tgl').value)); 
        formData.set('Ket Ekor', document.getElementById('val_nama_ekor').value);
        formData.set('Pengirim', document.getElementById('nomor_pengirim').value);
        formData.append('raw_rincian', JSON.stringify(dataStore));

        fetch(scriptURL, { method: 'POST', body: formData }).then(res => res.json()).then(data => {
            if (data.result === "success") {
                 status.innerText = "✅ Berhasil!"; status.style.color = "var(--success)";
                 btn.style.display = 'none'; document.getElementById('btn-wa').style.display = 'flex';
                 const delData = new FormData(); delData.append('action', 'delete_draft'); delData.append('Kode Toko', currentStoreCode);
                 fetch(scriptURL, { method: 'POST', body: delData }); 
                 showAlert("Berhasil!", "Laporan Final tersimpan.");
            } else { throw new Error(data.error); }
        }).catch(err => { status.innerText = "Gagal: " + err.message; btn.disabled = false; btn.innerText = "💾 SIMPAN FINAL"; showAlert("Error", "Gagal mengirim. Coba lagi."); });
    }

    function kirimWA() {
        let getVal = (id) => document.getElementById('view_'+id).value;
        let kode = document.getElementById('formKode').value || currentStoreCode;
        let nama = document.getElementById('nama_toko').value;
        let pengirim = document.getElementById('nomor_pengirim').value || "-"; 
        let ekorTxt = getVal('ekor_sales');
        if(document.getElementById('val_nama_ekor').value) ekorTxt += ` (a.n ${document.getElementById('val_nama_ekor').value})`;
        let txt = `*LAPORAN SALES*\n*${kode} - ${nama}*\n*Tgl:* ${document.getElementById('tgl').value}\n*Sales:* Rp ${document.getElementById('total_sales').value}\n------------------\n*Fisik:*\n1. Sore: ${getVal('setor_sore')}\n2. Malam: ${getVal('setor_malam')}\n3. Pagi: ${getVal('setor_pagi')}\n4. Ekor: ${ekorTxt}\n------------------\n*Total Setor: ${document.getElementById('disp_total_fisik').innerText}*\n\n*Status:* ${document.getElementById('disp_balance').innerText}\n👤 *Pengirim:* ${pengirim}`;
        window.open(`https://wa.me/6285183347653?text=${encodeURIComponent(txt)}`, '_blank');
    }

    function manualSaveDraft() { autoSaveDraft(); showAlert("Tersimpan", "Draf berhasil disimpan manual ke cloud."); }
    function confirmDeleteDraft() { showConfirm("Hapus Draf?", "Data cloud akan dihapus.", true, function() { const form = new FormData(); form.append('action', 'delete_draft'); form.append('Kode Toko', currentStoreCode); fetch(scriptURL, { method: 'POST', body: form }).then(() => location.reload()); }); }
    
    function autoSaveDraft() { 
        if (!currentStoreCode) return;
        const toast = document.getElementById('autoSaveStatus'); toast.style.display = 'block';
        if(saveTimeout) clearTimeout(saveTimeout);
        const formData = new FormData(); formData.append('action', 'save_draft'); formData.append('Kode Toko', currentStoreCode); formData.append('draft_data', JSON.stringify(collectDraftData())); 
        fetch(scriptURL, { method: 'POST', body: formData }).then(()=>{ toast.innerText = "✅ Tersimpan"; saveTimeout = setTimeout(() => { toast.style.display = 'none'; toast.innerText="Menyimpan draf..."; }, 1500); }).catch(e => console.log("Autosave err")); 
    }

    function collectDraftData() { return { tgl: document.getElementById('tgl').value, nama_toko: document.getElementById('nama_toko').value, total_sales: document.getElementById('total_sales').value, pengirim: document.getElementById('nomor_pengirim').value, dataStore: dataStore, ekor_note: document.getElementById('val_nama_ekor').value, h_setor_sore: document.getElementById('h_setor_sore').value, h_setor_malam: document.getElementById('h_setor_malam').value, h_setor_pagi: document.getElementById('h_setor_pagi').value, h_ekor_sales: document.getElementById('h_ekor_sales').value, h_pot_ba: document.getElementById('h_pot_ba').value, h_pot_lebih: document.getElementById('h_pot_lebih').value, h_pot_virtual: document.getElementById('h_pot_virtual').value }; }
    function getCleanNumber(val) { if (!val) return 0; return Number(val.toString().replace(/\./g, '')) || 0; }
    function formatRibuan(element) { let val = element.value.replace(/[^,\d]/g, '').toString(); let split = val.split(','); let sisa = split[0].length % 3; let rupiah = split[0].substr(0, sisa); let ribuan = split[0].substr(sisa).match(/\d{3}/gi); if (ribuan) { let separator = sisa ? '.' : ''; rupiah += separator + ribuan.join('.'); } rupiah = split[1] != undefined ? rupiah + ',' + split[1] : rupiah; element.value = rupiah; if (element.id === 'total_sales') autoSaveDraft(); }
    function formatDateIndo(dateString) { if (!dateString) return ""; let parts = dateString.split('-'); if (parts.length !== 3) return dateString; return `${parts[2]}-${parts[1]}-${parts[0]}`; }
    function calculateDistance(lat1, lon1, lat2, lon2) { const R = 6371000; const toRad = (x) => x * Math.PI / 180; const dLat = toRad(lat2 - lat1); const dLon = toRad(lon2 - lon1); const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2); const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); return R * c; }
</script>
