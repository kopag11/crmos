<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRMOS V3 (Original Supabase)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           CSS ASLI CRMOS V3 (RESTORASI TOTAL)
           ========================================= */
        :root {
            --primary: #3b82f6; 
            --primary-dark: #2563eb; 
            --primary-soft: #eff6ff;
            --bg-color: #f1f5f9; 
            --card-bg: #ffffff; 
            --text-dark: #1e293b;
            --text-gray: #64748b; 
            --success: #10b981; 
            --warning: #f59e0b; 
            --danger: #ef4444;
            --radius: 20px; 
            --shadow: 0 10px 30px -10px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-dark); margin: 0; padding: 0; min-height: 100vh; }
        
        .container { width: 100%; max-width: 500px; margin: 0 auto; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }
        h1, h2, h3 { font-family: 'Poppins', sans-serif; margin: 0; }
        
        /* --- LOGIN SCREEN ASLI --- */
        #loginScreen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; animation: fadeIn 0.5s ease; }
        
        .logo-circle {
            width: 80px; height: 80px; 
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            margin-bottom: 25px; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }
        .logo-circle svg { width: 40px; height: 40px; fill: white; }
        
        .pin-wrapper { position: relative; width: 100%; margin: 30px 0; }
        .input-pin {
            font-family: 'Poppins', sans-serif; font-size: 2.2rem; width: 100%; text-align: center;
            letter-spacing: 12px; padding: 20px; border: 2px solid #e2e8f0; border-radius: var(--radius);
            background: white; color: var(--text-dark); outline: none; transition: 0.3s;
            text-transform: uppercase;
        }
        .input-pin:focus { border-color: var(--primary); box-shadow: 0 0 0 5px var(--primary-soft); }
        
        .btn-main {
            background: var(--text-dark); color: white; border: none; padding: 18px; border-radius: 50px;
            font-weight: 600; font-size: 1rem; width: 100%; cursor: pointer; 
            box-shadow: 0 10px 20px rgba(30, 41, 59, 0.2); transition: transform 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-main:active { transform: scale(0.95); }

        /* --- DASHBOARD ASLI --- */
        #dashboard { display: none; padding-bottom: 80px; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .header-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white; padding: 25px; border-radius: var(--radius); margin-bottom: 25px;
            box-shadow: 0 15px 30px -10px rgba(37, 99, 235, 0.4); position: relative; overflow: hidden;
        }
        /* Hiasan bulat header V3 */
        .header-card::before {
            content: ''; position: absolute; top: -50px; right: -50px; width: 150px; height: 150px;
            background: rgba(255,255,255,0.1); border-radius: 50%;
        }
        
        .card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 15px; border: 1px solid #f8fafc; }
        .form-label { font-size: 0.8rem; font-weight: 700; color: var(--text-gray); margin-bottom: 8px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .input-group { display: flex; align-items: center; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 5px; }
        .input-group input { width: 100%; border: none; background: transparent; padding: 12px; font-size: 1rem; color: var(--text-dark); outline: none; font-weight: 500; font-family: 'Inter', sans-serif; }
        
        .btn-plus { width: 45px; height: 45px; background: white; border: 1px solid #e2e8f0; border-radius: 10px; color: var(--primary); font-size: 1.5rem; cursor: pointer; margin-left: 5px; display: flex; align-items: center; justify-content: center; }

        /* KARTU TOTAL BIRU */
        .total-box { background: var(--primary-soft); border: 1px solid #bfdbfe; text-align: center; padding: 25px; }
        .total-box input { text-align: center; font-size: 2rem; font-weight: 700; color: var(--primary-dark); background: transparent; border: none; width: 100%; outline: none; }
        
        /* SUMMARY BOX */
        .summary-box { background: #1e293b; color: white; padding: 20px; border-radius: var(--radius); margin-top: 10px; }
        .sum-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.95rem; opacity: 0.9; }
        
        .status-pill { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; text-align: center; font-weight: 700; margin-top: 20px; backdrop-filter: blur(5px); }
        .st-ok { background: var(--success); } .st-min { background: var(--danger); } .st-plus { background: var(--primary); }
        
        /* BUTTONS */
        .btn-submit { width: 100%; padding: 16px; border: none; border-radius: var(--radius); font-weight: 700; font-size: 1rem; color: white; cursor: pointer; margin-top: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; gap: 10px; }
        .bg-blue { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }
        .bg-green { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        
        /* MODAL */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-box { background: white; width: 90%; max-width: 380px; padding: 25px; border-radius: 24px; animation: popUp 0.3s ease; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        @keyframes popUp { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .calc-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .btn-del { width: 40px; background: #fee2e2; color: red; border: none; border-radius: 8px; font-weight: bold; }
        
        /* OVERLAYS */
        #qrOverlay, #exitScreen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 3000; background: white; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .pulse-icon { font-size: 4rem; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

<div id="qrOverlay">
    <div class="pulse-icon">⏳</div>
    <h3>Memproses...</h3>
</div>

<div id="loginScreen">
    <div class="logo-circle">
        <svg viewBox="0 0 24 24">
            <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z"></path>
        </svg>
    </div>
    <h2 style="margin-bottom: 5px;">CRMOS V3</h2>
    <p style="color: var(--text-gray); margin-bottom: 40px;">Original Supabase Edition</p>
    
    <div class="pin-wrapper">
        <input type="text" id="inputKode" class="input-pin" placeholder="KODE" maxlength="4">
    </div>
    
    <button class="btn-main" id="btnLogin" onclick="attemptLogin()">
        <span>MASUK APLIKASI</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
    </button>
    <p id="loginStatus" style="margin-top: 20px; font-size: 0.9rem; color: #94a3b8;">System Ready</p>
</div>

<div id="dashboard">
    <div class="header-card">
        <div>
            <span style="opacity: 0.8; font-size: 0.9rem;">Selamat Datang,</span>
            <h2 id="dispNama" style="margin: 5px 0;">Nama Toko</h2>
            <div id="dispKode" style="background: rgba(255,255,255,0.2); display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 0.85rem; font-weight: 600;">CODE</div>
        </div>
        <button onclick="logout()" style="background: white; color: var(--danger); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
            </svg>
        </button>
    </div>

    <div id="draftStatus" style="display:none; padding:15px; background:#fffbeb; color:#b45309; border:1px solid #fcd34d; border-radius:12px; margin-bottom:20px; font-size:0.9rem;"></div>
    
    <button onclick="hapusDraft()" style="width:100%; padding:15px; background:white; border:1px solid #fee2e2; color:#ef4444; border-radius:16px; margin-bottom:20px; font-weight:600;">🗑️ Hapus Draf Cloud</button>

    <div class="card">
        <span class="form-label">📅 Tanggal Sales</span>
        <div class="input-group">
            <input type="date" id="tgl" onchange="autoSave()">
        </div>
        <br>
        <span class="form-label">📱 WhatsApp Anda</span>
        <div class="input-group">
            <input type="tel" id="wa" placeholder="08xxxxxxxx">
        </div>
    </div>

    <div class="card total-box">
        <span class="form-label" style="color: var(--primary);">💰 TOTAL SALES TUTUPAN</span>
        <input type="text" id="total_sales" placeholder="0" onkeyup="fmt(this); hitung();">
    </div>

    <div id="dynamicInputs"></div>

    <div class="summary-box">
        <div class="sum-row"><span>Total Fisik</span><strong id="txtFisik">Rp 0</strong></div>
        <div class="sum-row"><span>Total Potongan</span><strong id="txtPotong">Rp 0</strong></div>
        <div style="height:1px; background:rgba(255,255,255,0.1); margin:15px 0;"></div>
        <div id="statusBox" class="status-pill st-ok">✅ BALANCE</div>
    </div>

    <input type="hidden" id="val_fisik" value="0"><input type="hidden" id="val_selisih" value="0">
    <input type="hidden" id="nama_toko">

    <button id="btnSimpan" class="btn-submit bg-blue" onclick="processSubmit()">
        <span>☁️ SIMPAN KE DATABASE</span>
    </button>
    <button class="btn-submit bg-green" onclick="kirimWA()">
        <span>📲 KIRIM KE WHATSAPP</span>
    </button>
    
    <div style="text-align:center; margin-top:30px; font-size:0.7rem; color:#cbd5e1;">V3.SUPABASE.FINAL</div>
</div>

<div id="calcModal" class="modal-overlay">
    <div class="modal-box">
        <h3 id="modalTitle" style="margin-bottom:20px; color:var(--text-dark);">Rincian</h3>
        <div id="calcList" style="max-height:200px; overflow-y:auto; margin-bottom:15px;"></div>
        <button onclick="addCalcRow()" style="width:100%; padding:12px; background:#f8fafc; border:1px dashed #cbd5e1; border-radius:12px; color:var(--text-gray); margin-bottom:20px;">+ Tambah</button>
        <div style="text-align:right; font-weight:bold; margin-bottom:20px;">Total: <span id="modalTotal">0</span></div>
        <div style="display:flex; gap:10px;">
            <button onclick="document.getElementById('calcModal').style.display='none'" style="flex:1; padding:15px; border:1px solid #e2e8f0; border-radius:15px; background:transparent;">Batal</button>
            <button onclick="saveCalc()" style="flex:1; padding:15px; background:var(--primary); color:white; border:none; border-radius:15px; font-weight:bold;">Simpan</button>
        </div>
    </div>
</div>

<script>
    // --- KONFIGURASI ---
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzX8YNW9U6fyuCzBOWB_lcu7FDJS5ivTOI5RU2QBAVQz-sW_ov4ys_CSuqxQNnYDQLT/exec';
    const SUPABASE_URL = 'https://mpzxceuhnuhuhuveppmh.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wenhjZXVobnVoaHV2dmVwcG1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgyNjQwNDEsImV4cCI6MjA4Mzg0MDA0MX0.sIRvchXgTH9kEMCqhuM2geYohe1TiipYgxz3PQ_y4R0';
    
    let supabase = null;
    let dataStore = {};
    let activeField = "";
    let currentCode = "";

    // --- 1. STARTUP ---
    window.onload = function() {
        document.getElementById('tgl').value = new Date(new Date()-864e5).toISOString().split('T')[0];
        if(localStorage.getItem('crm_wa')) document.getElementById('wa').value = localStorage.getItem('crm_wa');
        renderForm(); // Gambar Form V3
        
        // Auto Login
        let sess = localStorage.getItem('crm_sess');
        if(sess) {
            let p = sess.split('|');
            loginSuccess(p[0], p[1]);
        }
    };

    // --- 2. LOGIN LOGIC (ANTI-STUCK / FORCE MODE) ---
    function attemptLogin() {
        let k = document.getElementById('inputKode').value.toUpperCase().trim();
        let btn = document.getElementById('btnLogin');
        let stat = document.getElementById('loginStatus');

        if(!k) return alert("Masukkan Kode Toko");
        if(k === 'COBA') { loginSuccess('COBA', 'Toko Uji Coba'); return; }

        btn.disabled = true;
        stat.innerText = "Menghubungi Server...";

        // TIMER PENGAMAN (3 Detik)
        // Jika dalam 3 detik tidak ada respon, kita anggap script macet dan minta input manual
        let isComplete = false;
        let timer = setTimeout(() => {
            if(!isComplete) {
                isComplete = true;
                // Force Entry Mode
                let manualName = prompt("Koneksi Lambat. Konfirmasi Nama Toko:", "Toko " + k);
                if(manualName) {
                    loginSuccess(k, manualName);
                } else {
                    btn.disabled = false; stat.innerText = "Login Dibatalkan";
                }
            }
        }, 3000); // 3000ms = 3 detik

        // FETCH REAL
        fetch(SCRIPT_URL + "?action=get_shop_info&kode=" + k)
        .then(r => r.json())
        .then(d => {
            if(!isComplete) {
                isComplete = true;
                clearTimeout(timer); // Matikan timer karena sukses
                if(d.error) {
                    alert(d.error);
                    btn.disabled = false; stat.innerText = "Kode Salah";
                } else {
                    loginSuccess(k, d.nama);
                }
            }
        })
        .catch(e => {
            // Error network biasanya ditangani timer, tapi untuk jaga-jaga
            console.log("Fetch fail, waiting timer...");
        });
    }

    function loginSuccess(kode, nama) {
        currentCode = kode;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('dispKode').innerText = kode;
        document.getElementById('dispNama').innerText = nama;
        document.getElementById('nama_toko').value = nama;
        localStorage.setItem('crm_sess', kode + '|' + nama);
        loadDraft();
    }

    function logout() {
        if(confirm("Keluar aplikasi?")) {
            localStorage.removeItem('crm_sess');
            location.reload();
        }
    }

    // --- 3. FORM UI V3 ---
    function renderForm() {
        // Definisi Field sama persis V3
        const f1 = [
            {id:'setor_sore', l:'☀️ Setor Sore', d:'Sales H-1', g:'fisik'},
            {id:'setor_malam', l:'🌙 Setor Malam', d:'21.00-24.00', g:'fisik'},
            {id:'setor_pagi', l:'🌅 Setor Pagi', d:'24.00-Selesai', g:'fisik'},
            {id:'ekor_sales', l:'🪙 Ekor Sales', d:'Transfer', g:'fisik', note:true}
        ];
        const f2 = [
            {id:'pot_ba', l:'⚠️ Potongan BA', d:'Varian', g:'potong'},
            {id:'pot_lebih', l:'➕ Pot. Lebih', d:'Tertelan', g:'potong', check:true},
            {id:'pot_virtual', l:'💳 Potongan Virtual', d:'Koreksi', g:'potong'}
        ];

        let h1 = `<div class="card"><h3 style="color:var(--primary); margin-bottom:15px; font-size:1rem;">💵 Uang Fisik</h3>`;
        let h2 = `<div class="card"><h3 style="color:var(--danger); margin-bottom:15px; font-size:1rem;">✂️ Potongan</h3>`;

        const renderField = (x) => {
            if(!dataStore[x.id]) dataStore[x.id] = [];
            let extra = x.note ? `<input type="text" id="note_${x.id}" placeholder="Ket. Ekor (Nama Pengirim)" oninput="autoSave()" style="width:100%; padding:12px; margin-top:10px; border:1px dashed #cbd5e1; border-radius:12px; background:#f8fafc;">` : '';
            let chk = x.check ? `<span style="float:right; font-size:0.75rem; color:#64748b;"><input type="checkbox" id="check_${x.id}"> Tertelan?</span>` : '';
            
            return `
            <div style="margin-bottom:20px;">
                <span class="form-label">${x.l} ${chk}</span>
                <div class="input-group">
                    <input type="text" id="view_${x.id}" value="Rp 0" readonly onclick="openCalc('${x.id}','${x.l}')">
                    <button class="btn-plus" onclick="openCalc('${x.id}','${x.l}')">+</button>
                </div>
                <input type="hidden" id="val_${x.id}" value="0">
                ${extra}
            </div>`;
        };

        f1.forEach(x => h1 += renderField(x));
        f2.forEach(x => h2 += renderField(x));

        document.getElementById('dynamicInputs').innerHTML = h1 + "</div>" + h2 + "</div>";
    }

    // --- 4. CALCULATOR ---
    function openCalc(id, t) {
        activeField = id;
        document.getElementById('modalTitle').innerText = t;
        document.getElementById('calcModal').style.display = 'flex';
        renderRows();
    }
    function renderRows() {
        let c = document.getElementById('calcList'); c.innerHTML = "";
        (dataStore[activeField]||[0]).forEach((v,i) => {
            c.innerHTML += `
            <div class="calc-row">
                <input class="input-group" style="flex:1; border-radius:12px;" type="tel" value="${v===0?'':v.toLocaleString('id-ID')}" onkeyup="fmt(this); upTotal()" placeholder="0">
                <button onclick="delRow(${i})" class="btn-del">✕</button>
            </div>`;
        });
        upTotal();
    }
    function addCalcRow() { saveTmp(); dataStore[activeField].push(0); renderRows(); }
    function delRow(i) { saveTmp(); dataStore[activeField].splice(i,1); renderRows(); }
    function saveTmp() { 
        let inputs = document.querySelectorAll('#calcList input');
        dataStore[activeField] = Array.from(inputs).map(i => Number(i.value.replace(/\./g,''))||0); 
    }
    function upTotal() { 
        let t = 0; 
        document.querySelectorAll('#calcList input').forEach(i => t += Number(i.value.replace(/\./g,''))||0);
        document.getElementById('modalTotal').innerText = t.toLocaleString('id-ID');
    }
    function saveCalc() {
        saveTmp();
        let t = dataStore[activeField].reduce((a,b)=>a+b,0);
        document.getElementById('view_'+activeField).value = "Rp " + t.toLocaleString('id-ID');
        document.getElementById('val_'+activeField).value = t;
        document.getElementById('calcModal').style.display = 'none';
        hitung();
    }

    // --- 5. LOGIC HITUNG ---
    function fmt(e) { e.value = (Number(e.value.replace(/\./g,''))||0).toLocaleString('id-ID'); if(e.value=='0') e.value=''; }
    
    function hitung() {
        let sales = Number(document.getElementById('total_sales').value.replace(/\./g,'')) || 0;
        let fisik = 0; ['setor_sore','setor_malam','setor_pagi','ekor_sales'].forEach(k => fisik += Number(document.getElementById('val_'+k).value)||0);
        let potong = 0; ['pot_ba','pot_lebih','pot_virtual'].forEach(k => potong += Number(document.getElementById('val_'+k).value)||0);
        
        document.getElementById('txtFisik').innerText = "Rp " + fisik.toLocaleString('id-ID');
        document.getElementById('txtPotong').innerText = "Rp " + potong.toLocaleString('id-ID');
        
        let selisih = (fisik + potong) - sales;
        document.getElementById('val_selisih').value = selisih;
        document.getElementById('val_fisik').value = fisik;

        let box = document.getElementById('statusBox');
        if(sales === 0) {
            box.className = "status-pill"; box.innerText = "📝 ISI DATA DULU"; box.style.background = "#f1f5f9"; box.style.color = "#94a3b8";
        } else if(selisih === 0) {
            box.className = "status-pill st-ok"; box.innerText = "✅ BALANCE OK";
        } else if(selisih > 0) {
            box.className = "status-pill st-plus"; box.innerText = "➕ LEBIH Rp " + selisih.toLocaleString('id-ID');
        } else {
            box.className = "status-pill st-min"; box.innerText = "⚠️ KURANG Rp " + Math.abs(selisih).toLocaleString('id-ID');
        }
        
        autoSave();
    }

    // --- 6. SUBMIT SUPABASE ---
    async function processSubmit() {
        let btn = document.getElementById('btnSimpan');
        if(!document.getElementById('tgl').value) return alert("Tanggal Kosong!");

        btn.disabled = true; btn.innerHTML = "🔄 CONNECTING DB...";
        
        try {
            // Lazy load Supabase
            if(!supabase) supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            btn.innerHTML = "🚀 SENDING...";
            
            let payload = {
                kode_toko: currentCode,
                nama_toko: document.getElementById('nama_toko').value,
                tgl_sales: document.getElementById('tgl').value,
                total_sales: Number(document.getElementById('total_sales').value.replace(/\./g,''))||0,
                total_fisik: Number(document.getElementById('val_fisik').value),
                total_potongan: Number(document.getElementById('txtPotong').innerText.replace(/\D/g,''))||0,
                selisih: Number(document.getElementById('val_selisih').value),
                pengirim: document.getElementById('wa').value
            };

            // Hapus data lama (anti duplikat)
            await supabase.from('rincian_sales').delete().eq('kode_toko', currentCode).eq('tgl_sales', payload.tgl_sales);
            // Simpan Data Induk
            const { error } = await supabase.from('laporan_sales').upsert(payload, { onConflict: 'kode_toko, tgl_sales' });
            if(error) throw error;

            // Simpan Rincian
            let rincian = [];
            const map = {'setor_sore':'Setor Sore', 'setor_malam':'Setor Malam', 'setor_pagi':'Setor Pagi', 'ekor_sales':'Ekor Sales', 'pot_ba':'Potongan BA', 'pot_lebih':'Potongan Lebih', 'pot_virtual':'Potongan Virtual'};
            
            for(let k in dataStore) {
                let vals = dataStore[k];
                if(vals && vals.length > 0) {
                    vals.forEach(v => {
                        if(v > 0) {
                            let ket = '';
                            if(k==='ekor_sales') ket = document.getElementById('note_ekor').value;
                            if(k==='pot_lebih' && document.getElementById('check_pot_lebih') && document.getElementById('check_pot_lebih').checked) ket = "Tertelan";
                            rincian.push({
                                kode_toko: currentCode, tgl_sales: payload.tgl_sales,
                                kategori: map[k], nominal: v, keterangan: ket, cek_manual_saldo: null
                            });
                        }
                    });
                }
            }
            if(rincian.length > 0) await supabase.from('rincian_sales').insert(rincian);

            alert("✅ SUKSES TERSIMPAN!");
            hapusDraft(true);
            kirimWA();
            
        } catch(e) {
            alert("Gagal: " + e.message);
            btn.disabled = false; btn.innerHTML = "☁️ SIMPAN KE DATABASE";
        }
    }

    function kirimWA() {
        let tgl = document.getElementById('tgl').value.split('-');
        let wa = document.getElementById('wa').value;
        let selisih = Number(document.getElementById('val_selisih').value);
        let stat = selisih===0 ? "BALANCE OK ✅" : (selisih>0 ? `LEBIH (+) ${selisih.toLocaleString('id-ID')}` : `KURANG (-) ${Math.abs(selisih).toLocaleString('id-ID')}`);
        
        let txt = `*LAPORAN SETOR SALES*\n*${currentCode} - ${document.getElementById('nama_toko').value}*\nTgl: ${tgl[2]}-${tgl[1]}-${tgl[0]}\nTotal Sales: Rp ${document.getElementById('total_sales').value}\n\n*STATUS: ${stat}*\n\nPengirim: ${wa}`;
        
        localStorage.removeItem('crm_sess');
        window.location.href = "https://wa.me/6285183347653?text=" + encodeURIComponent(txt);
    }

    // --- 7. DRAFT ---
    function autoSave() {
        let d = {
            tgl: document.getElementById('tgl').value,
            sales: document.getElementById('total_sales').value,
            data: dataStore,
            ekor: document.getElementById('note_ekor') ? document.getElementById('note_ekor').value : ''
        };
        const fd = new FormData(); fd.append('action','save_draft'); fd.append('Kode Toko', currentCode); fd.append('draft_data', JSON.stringify(d));
        fetch(SCRIPT_URL, {method:'POST', body:fd, mode:'no-cors'}).catch(()=>{});
    }

    function loadDraft() {
        document.getElementById('draftStatus').style.display = 'block';
        document.getElementById('draftStatus').innerText = "Cek Draft...";
        fetch(SCRIPT_URL + "?action=load_draft&kode=" + currentCode)
        .then(r=>r.json()).then(d => {
            if(d.sales) {
                document.getElementById('total_sales').value = d.sales;
                if(d.data) dataStore = d.data;
                for(let k in dataStore) {
                    let t = dataStore[k].reduce((a,b)=>a+b,0);
                    document.getElementById('view_'+k).value = "Rp " + t.toLocaleString('id-ID');
                    document.getElementById('val_'+k).value = t;
                }
                if(d.ekor && document.getElementById('note_ekor')) document.getElementById('note_ekor').value = d.ekor;
                hitung();
                document.getElementById('draftStatus').innerText = "✅ Draft Dipulihkan";
            } else {
                document.getElementById('draftStatus').style.display = 'none';
            }
        }).catch(e=>{ document.getElementById('draftStatus').style.display = 'none'; });
    }

    function hapusDraft(silent) {
        if(!silent && !confirm("Hapus draft?")) return;
        const fd = new FormData(); fd.append('action','delete_draft'); fd.append('Kode Toko', currentCode);
        fetch(SCRIPT_URL, {method:'POST', body:fd, mode:'no-cors'});
        if(!silent) location.reload();
    }
</script>
