<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Report Sales CRM</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        
        :root { --primary: #3b82f6; --primary-dark: #2563eb; --primary-soft: #eff6ff; --bg-color: #f1f5f9; --card-bg: #ffffff; --text-dark: #1e293b; --text-gray: #64748b; --success: #10b981; --success-soft: #d1fae5; --warning: #f59e0b; --warning-soft: #fef3c7; --danger: #ef4444; --danger-soft: #fee2e2; --radius: 16px; --radius-sm: 12px; --shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.05); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-dark); margin: 0; padding: 0; min-height: 100vh; line-height: 1.5; }
        .container { width: 100%; max-width: 550px; margin: 0 auto; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }
        h1, h2, h3 { family: 'Poppins', sans-serif; margin: 0; color: var(--text-dark); }
        #loginScreen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 30px 25px; background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); margin: 20px 0; }
        .icon-circle { width: 70px; height: 70px; background: var(--primary-soft); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 32px; color: var(--primary); }
        .login-note { background: var(--danger-soft); color: #b91c1c; padding: 12px 20px; border-radius: 50px; font-size: 0.85rem; font-weight: 600; margin-bottom: 30px; display: inline-flex; align-items: center; gap: 8px; }
        .pin-wrapper input { font-family: 'Poppins', monospace; font-size: 2.2rem; width: 100%; max-width: 280px; text-align: center; letter-spacing: 12px; padding: 15px; border: 2px solid #e2e8f0; border-radius: var(--radius); background: #f8fafc; color: var(--text-dark); outline: none; text-transform: uppercase; transition: 0.3s; }
        .pin-wrapper input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); }
        .btn-main { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; border: none; padding: 18px; border-radius: 50px; font-weight: 600; font-size: 1rem; width: 100%; cursor: pointer; box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25); margin-top: 20px; transition: 0.2s; }
        .btn-main:active { transform: scale(0.98); }
        #dashboard { display: none; padding-bottom: 60px; }
        .header-card { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; padding: 24px; border-radius: var(--radius); margin-bottom: 20px; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4); display: flex; justify-content: space-between; align-items: flex-start; }
        .store-badge { background: rgba(255,255,255,0.2); backdrop-filter: blur(5px); padding: 4px 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; display: inline-block; }
        .btn-logout { background: rgba(255,255,255,0.9); color: var(--danger); border: none; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 0.8rem; cursor: pointer; transition: 0.2s; }
        .card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 15px; border: 1px solid #f1f5f9; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: flex; align-items: center; font-size: 0.85rem; font-weight: 600; color: var(--text-gray); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-btn { margin-left: 8px; width: 20px; height: 20px; border-radius: 50%; background-color: var(--primary-soft); color: var(--primary); border: 1px solid var(--primary); font-size: 12px; font-weight: bold; font-family: serif; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        input[type="text"], input[type="date"], input[type="tel"], input[type="number"] { width: 100%; padding: 14px 16px; border: 1px solid #e2e8f0; border-radius: var(--radius-sm); font-size: 1rem; color: var(--text-dark); background: #f8fafc; font-family: 'Inter', sans-serif; outline: none; transition: 0.3s; -webkit-appearance: none; }
        input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        .highlight-card { background: var(--primary-soft); border: 1px solid #bfdbfe; }
        #total_sales { background: white; border-color: #93c5fd; color: var(--primary-dark); font-weight: 700; font-size: 1.4rem; text-align: center; }
        .input-with-btn { display: flex; gap: 10px; }
        .input-with-btn input { font-weight: 600; }
        .btn-add { background: var(--bg-color); color: var(--primary); border: 1px solid #e2e8f0; width: 55px; border-radius: var(--radius-sm); font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-add:active { background: #dbeafe; border-color: #bfdbfe; }
        .summary-card { background: #1e293b; color: white; text-align: center; padding: 25px; position: relative; overflow: hidden; border-radius: var(--radius); }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.95rem; opacity: 0.9; }
        .summary-divider { height: 1px; background: rgba(255,255,255,0.15); margin: 20px 0; }
        .status-box { padding: 15px; border-radius: 12px; font-weight: 700; font-size: 1.1rem; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .status-ok { background: var(--success); color: white; }
        .status-plus { background: #3b82f6; color: white; }
        .status-min { background: var(--danger); color: white; }
        .btn-draft { background: white; color: var(--danger); border: 1px solid var(--danger-soft); width: 100%; padding: 12px; border-radius: var(--radius-sm); margin-bottom: 20px; font-weight:600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem; }
        .btn-action { width: 100%; padding: 18px; border: none; border-radius: var(--radius); font-weight: 700; font-size: 1rem; cursor: pointer; color: white; margin-top: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-green { background: var(--success); }
        .btn-yellow { background: var(--warning); color: #78350f; }
        .btn-wa { background: #25D366; display: none; margin-top:15px;}
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px 25px; border-radius: 24px; width: 85%; max-width: 350px; animation: popUp 0.3s ease; box-shadow: 0 20px 40px rgba(0,0,0,0.2); text-align: center;}
        @keyframes popUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-footer { margin-top: 20px; display: flex; gap: 12px; }
        .btn-modal-primary, .btn-modal-danger, .btn-modal-cancel { flex: 1; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; border: none; }
        .btn-modal-primary { background: var(--primary); color: white; }
        .btn-modal-danger { background: var(--danger); color: white; }
        .btn-modal-cancel { background: transparent; color: var(--text-gray); border: 1px solid #e2e8f0; }
        .calc-row { display: flex; gap: 10px; margin-bottom: 10px; text-align: left;}
        .calc-input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        .btn-remove { background: var(--danger-soft); color: var(--danger); border: none; width: 45px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; }
        #historyList { font-size: 0.85rem; color: #b45309; padding: 15px; background: #fffbeb; border-radius: 12px; margin-bottom: 20px; border: 1px solid #fcd34d; display: none; text-align: left;}
        .section-title { display: flex; align-items: center; gap: 8px; font-size: 1rem; font-weight: 700; margin-bottom: 15px; }
        .t-fisik { color: var(--primary); }
        .t-potong { color: var(--danger); }
    </style>
</head>
<body>

<div class="container">
    <div id="loginScreen">
        <div style="margin-bottom: 20px;">
            <div class="icon-circle">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </div>
            <h2>Sales Report CRM</h2>
            <p style="color: var(--text-gray); margin: 5px 0 0 0;">Input Laporan Harian</p>
        </div>
        <div class="login-note"><span>📍</span> Wajib berada di lokasi toko</div>
        <div class="pin-wrapper">
            <input type="text" id="inputKode" maxlength="4" placeholder="KODE" inputmode="text">
        </div>
        <button class="btn-main" onclick="doLogin()">MASUK SEKARANG</button>
        <p id="gpsStatus" style="font-size:0.85rem; color:var(--text-gray); margin-top:25px;">⏳ Menunggu sinyal GPS...</p>
    </div>

    <div id="dashboard">
        <div class="header-card">
            <div class="store-info">
                <span style="font-size:0.8rem; opacity:0.9; margin-bottom:5px; display:block;">Selamat Datang,</span>
                <h2 id="displayNama">Nama Toko</h2>
                <div style="margin-top: 8px;"><span class="store-badge" id="displayKode">CODE</span></div>
            </div>
            <button class="btn-logout" onclick="logout()">Keluar ➔</button>
        </div>

        <div id="historyList">Loading...</div>
        <button type="button" class="btn-draft" onclick="confirmDeleteDraft()"><span>🗑️</span> Hapus Draf di Cloud</button>

        <form id="salesForm">
            <input type="hidden" name="Kode Toko" id="formKode">
            <input type="hidden" name="Info Perangkat" id="info_perangkat">
            
            <div class="card">
                <div class="form-group">
                    <label>📅 Tanggal Sales</label>
                    <input type="date" name="Tanggal" id="tgl" required onchange="autoSaveDraft()">
                </div>
                <div class="form-group">
                    <label>🏪 Nama Toko</label>
                    <input type="text" name="Nama Toko" id="nama_toko" readonly style="background:#f1f5f9; color:#64748b; font-weight: 500;"> 
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>📱 WA Pengirim (Opsional)</label>
                    <input type="tel" id="nomor_pengirim" placeholder="08xxxxxxx" onchange="saveSender(this.value)">
                </div>
            </div>

            <div class="card highlight-card">
                <div class="form-group" style="margin-bottom:0;">
                    <label style="color:var(--primary-dark); text-align: center; width: 100%;">💰 TOTAL SALES TUTUPAN (Rp)</label>
                    <input type="text" inputmode="numeric" name="Total Sales" id="total_sales" placeholder="0" onkeyup="formatRibuan(this); hitungGlobal();">
                </div>
            </div>

            <div id="dynamicInputs"></div>

            <div class="card summary-card">
                <div class="summary-row"><span>Total Uang Fisik</span><span id="disp_total_fisik" style="font-weight:600;">Rp 0</span></div>
                <div class="summary-row"><span>Total Potongan</span><span id="disp_total_potong" style="font-weight:600;">Rp 0</span></div>
                <div class="summary-divider"></div>
                <div style="font-size: 0.85rem; opacity: 0.8; margin-bottom: 5px;">Status Akhir:</div>
                <div id="disp_balance" class="status-box status-ok"><span>✅</span> 0</div>
            </div>

            <input type="hidden" name="Setor Sore" id="h_setor_sore" value="0">
            <input type="hidden" name="Setor Malam" id="h_setor_malam" value="0">
            <input type="hidden" name="Setor Pagi" id="h_setor_pagi" value="0">
            <input type="hidden" name="Ekor Sales" id="h_ekor_sales" value="0">
            <input type="hidden" name="Potongan BA" id="h_pot_ba" value="0">
            <input type="hidden" name="Potongan Lebih" id="h_pot_lebih" value="0">
            <input type="hidden" name="Potongan Virtual" id="h_pot_virtual" value="0">
            <input type="hidden" name="Total Setor Fisik" id="h_total_fisik" value="0">
            <input type="hidden" name="Ket Ekor" id="val_nama_ekor"> 
            <input type="hidden" id="val_selisih" value="0">

            <button type="button" class="btn-action btn-green" id="btn-submit" onclick="trySubmitForm()"><span>💾</span> SIMPAN FINAL</button>
            <button type="button" class="btn-action btn-wa" id="btn-wa" onclick="kirimWA()"><span>📲</span> KIRIM KE WHATSAPP</button>
            <p id="status" style="text-align:center; margin-top:20px; font-weight:600; color:var(--text-gray);"></p>
        </form>
    </div>
</div>

<div id="confirmModal" class="modal">
    <div class="modal-content">
        <span id="confirmIcon" class="modal-icon" style="font-size: 3rem; display:block; margin-bottom:10px;">⚠️</span>
        <div id="confirmTitle" class="modal-title" style="font-weight:700; margin-bottom:10px;">Konfirmasi</div>
        <div id="confirmMsg" class="modal-text" style="margin-bottom:20px;">Pesan konfirmasi...</div>
        <div class="modal-footer">
            <button class="btn-modal-cancel" onclick="closeConfirm()">Batal</button>
            <button id="btnConfirmYes" class="btn-modal-primary" onclick="doConfirmYes()">Ya, Lanjutkan</button>
        </div>
    </div>
</div>

<div id="alertModal" class="modal">
    <div class="modal-content">
        <span class="modal-icon" style="font-size: 3rem; display:block; margin-bottom:10px;">ℹ️</span>
        <div class="modal-title" id="alertTitle" style="font-weight:700;">Info</div>
        <div class="modal-text" id="alertMsg" style="margin-bottom:20px;">Message</div>
        <button class="btn-modal-primary" style="width:100%" onclick="document.getElementById('alertModal').style.display='none'">OK, Mengerti</button>
    </div>
</div>

<div id="calcModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle" style="margin-bottom:20px; color:var(--primary);">Rincian</h3>
        <div id="calcList" style="max-height:250px; overflow-y:auto; margin-bottom:15px; padding-right: 5px;"></div>
        <button onclick="addCalcRow()" style="background:#f8fafc; color:var(--primary); border:2px dashed #cbd5e1; padding:12px; width:100%; border-radius:12px; cursor:pointer; font-weight: 600; margin-bottom: 15px;">+ Tambah Baris</button>
        <div style="background: var(--primary-soft); padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <span style="font-size: 0.9rem; color: var(--text-gray);">Total Sementara:</span>
            <strong id="modalTotal" style="color:var(--primary); font-size: 1.1rem;">0</strong>
        </div>
        <div class="modal-footer">
            <button class="btn-modal-cancel" onclick="document.getElementById('calcModal').style.display='none'">Batal</button>
            <button class="btn-modal-primary" onclick="saveCalculator()">Simpan Hasil</button>
        </div>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzX8YNW9U6fyuCzBOWB_lcu7FDJS5ivTOI5RU2QBAVQz-sW_ov4ys_CSuqxQNnYDQLT/exec'; 
    const MAX_RADIUS_METERS = 40; 

    let currentStoreCode = "";
    let dataStore = {}; 
    let activeField = "";
    let onConfirmAction = null;

    window.addEventListener('load', function() {
        getDetailedDeviceInfo();
        let savedNum = localStorage.getItem('crm_sender_phone');
        if(savedNum && document.getElementById('nomor_pengirim')) {
            document.getElementById('nomor_pengirim').value = savedNum;
        }
    });

    function saveSender(val) { localStorage.setItem('crm_sender_phone', val); }
    async function getDetailedDeviceInfo() { document.getElementById('info_perangkat').value = navigator.userAgent; }

    function getCleanNumber(val) {
        if (!val) return 0;
        return Number(val.toString().replace(/[^0-9]/g, '')) || 0; 
    }

    function formatRibuan(element) {
        let val = element.value.replace(/[^,\d]/g, '').toString();
        let split = val.split(',');
        let sisa = split[0].length % 3;
        let rupiah = split[0].substr(0, sisa);
        let ribuan = split[0].substr(sisa).match(/\d{3}/gi);
        if (ribuan) { let separator = sisa ? '.' : ''; rupiah += separator + ribuan.join('.'); }
        rupiah = split[1] != undefined ? rupiah + ',' + split[1] : rupiah;
        element.value = rupiah;
        if (element.id === 'total_sales') autoSaveDraft(); 
    }

    async function doLogin() {
        const code = document.getElementById('inputKode').value.toUpperCase().trim();
        if (code.length !== 4) return showAlert("Gagal", "Kode harus 4 karakter");
        
        if (code === "COBA") { setupDashboard("COBA", "Toko Uji Coba", "TEST"); showAlert("Mode Uji Coba", "Masuk tanpa GPS."); return; }

        document.getElementById('gpsStatus').innerText = "Sedang melacak lokasi...";
        try {
            const res = await fetch(scriptURL + "?action=get_shop_info&kode=" + code + "&t=" + new Date().getTime());
            const shop = await res.json();
            if (shop.error) throw new Error(shop.error);

            navigator.geolocation.getCurrentPosition(pos => {
                const dist = calculateDistance(pos.coords.latitude, pos.coords.longitude, shop.lat, shop.lon);
                if (dist > MAX_RADIUS_METERS) return showAlert("Lokasi Jauh", `Anda berjarak ${Math.round(dist)}m dari toko.`);
                setupDashboard(code, shop.nama, code);
            }, () => showAlert("GPS Mati", "Mohon aktifkan GPS/Lokasi di HP Anda."));
        } catch(e) { showAlert("Login Gagal", e.message); }
    }

    function setupDashboard(code, nama, badge) {
        currentStoreCode = code;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('displayKode').innerText = badge;
        document.getElementById('formKode').value = code;
        document.getElementById('displayNama').innerText = nama;
        document.getElementById('nama_toko').value = nama;
        loadDraft();
    }
    
    function logout() { location.reload(); }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000; const toRad = (x) => x * Math.PI / 180;
        const dLat = toRad(lat2 - lat1); const dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); 
    }

    function initForm() {
        const fieldsFisik = [
            {id:'setor_sore', label:'☀️ Setor Sore', desc:'Setoran setelah sales H-1 clear'},
            {id:'setor_malam', label:'🌙 Setor Malam', desc:'Setoran jam 21.00 - 24.00'},
            {id:'setor_pagi', label:'🌅 Setor Pagi (H+1)', desc:'Setoran pagi untuk sales kemarin'},
            {id:'ekor_sales', label:'🪙 Ekor Sales', hasNote: true, desc:'Transfer m-banking untuk ekor'}
        ];
        const fieldsPotong = [
            {id:'pot_ba', label:'⚠️ Potongan BA Var', desc:'BA yang sudah di-TTD'},
            {id:'pot_lebih', label:'➕ Potongan Lebih', desc:'Potong kelebihan setor sebelumnya'},
            {id:'pot_virtual', label:'💳 Potongan Virtual', desc:'Email virtual gagal/koreksi'}
        ];

        let html = `<div class="card"><div class="section-title t-fisik"><span>💵</span> Uang Fisik</div>`;
        fieldsFisik.forEach(f => html += createFieldHtml(f));
        html += `</div><div class="card"><div class="section-title t-potong"><span>✂️</span> Potongan</div>`;
        fieldsPotong.forEach(f => html += createFieldHtml(f));
        html += `</div>`;
        document.getElementById('dynamicInputs').innerHTML = html;
        
        [...fieldsFisik, ...fieldsPotong].forEach(f => {
            if (!dataStore[f.id]) dataStore[f.id] = [0]; 
        });
        hitungGlobal();
    }

    function createFieldHtml(f) {
        let ekorVal = document.getElementById('val_nama_ekor') ? document.getElementById('val_nama_ekor').value : '';
        let noteInput = f.hasNote ? `<input type="text" id="note_ekor" placeholder="Ket. Ekor" value="${ekorVal}" oninput="document.getElementById('val_nama_ekor').value=this.value; autoSaveDraft();" style="margin-top:10px; border:1px dashed #cbd5e1; background: #f8fafc;">` : '';
        let infoHtml = f.desc ? `<span class="info-btn" onclick="showAlert('Info', '${f.desc}')">i</span>` : '';

        return `<div class="form-group">
                    <label>${f.label} ${infoHtml}</label>
                    <div class="input-with-btn">
                        <input type="text" id="view_${f.id}" value="Rp 0" readonly style="background:white; cursor: pointer;" onclick="openCalc('${f.id}', '${f.label}')">
                        <button type="button" class="btn-add" onclick="openCalc('${f.id}', '${f.label}')">+</button>
                    </div>
                    ${noteInput}
                </div>`;
    }

    function openCalc(id, title) { 
        activeField=id; 
        document.getElementById('modalTitle').innerText=title; 
        document.getElementById('calcModal').style.display='flex'; 
        renderCalcRows(); 
        updateModalTotal(); 
    }

    function renderCalcRows() {
        const c = document.getElementById('calcList'); c.innerHTML="";
        let vals = dataStore[activeField] || [0];
        if(vals.length===0) vals.push(0);
        
        vals.forEach((v,i) => {
            c.innerHTML += `<div class="calc-row">
                <input type="text" inputmode="numeric" class="calc-input" value="${v===0?'':v.toLocaleString('id-ID')}" onkeyup="formatRibuan(this);updateModalTotal()">
                <button class="btn-remove" onclick="removeRow(${i})">✕</button>
            </div>`;
        });
    }

    function addCalcRow() { saveTemp(); dataStore[activeField].push(0); renderCalcRows(); }
    function removeRow(i) { saveTemp(); dataStore[activeField].splice(i,1); renderCalcRows(); updateModalTotal(); }
    function saveTemp() { dataStore[activeField] = Array.from(document.querySelectorAll('.calc-input')).map(i=>getCleanNumber(i.value)); }
    function updateModalTotal() { 
        let t=0; document.querySelectorAll('.calc-input').forEach(i=>t+=getCleanNumber(i.value)); 
        document.getElementById('modalTotal').innerText="Rp "+t.toLocaleString('id-ID'); 
    }
    
    function saveCalculator() {
        saveTemp(); 
        let t = dataStore[activeField].reduce((a,b)=>a+b,0);
        document.getElementById('view_'+activeField).value="Rp "+t.toLocaleString('id-ID');
        document.getElementById('h_'+activeField).value=t; 
        document.getElementById('calcModal').style.display='none'; 
        hitungGlobal();
    }

    function hitungGlobal() {
        let sales = getCleanNumber(document.getElementById('total_sales').value);
        let fisik = 0; let potong = 0;
        ['setor_sore', 'setor_malam', 'setor_pagi', 'ekor_sales'].forEach(k => fisik += Number(document.getElementById('h_'+k).value)||0);
        ['pot_ba', 'pot_lebih', 'pot_virtual'].forEach(k => potong += Number(document.getElementById('h_'+k).value)||0);

        document.getElementById('disp_total_fisik').innerText = "Rp " + fisik.toLocaleString('id-ID');
        document.getElementById('disp_total_potong').innerText = "Rp " + potong.toLocaleString('id-ID');
        document.getElementById('h_total_fisik').value = fisik;

        let selisih = (fisik + potong) - sales;
        document.getElementById('val_selisih').value = selisih;

        let elBal = document.getElementById('disp_balance');
        let btn = document.getElementById('btn-submit');
        elBal.classList.remove('status-ok', 'status-plus', 'status-min');

        if (selisih < 0) {
            elBal.innerHTML = `<span>⚠️</span> KURANG (-) Rp ` + Math.abs(selisih).toLocaleString('id-ID');
            elBal.classList.add('status-min');
            btn.innerHTML = `<span>⚠️</span> SIMPAN (MINUS)`;
            btn.className = "btn-action btn-yellow";
        } else {
            if (selisih === 0) {
                elBal.innerHTML = `<span>✅</span> BALANCE (PAS)`; 
                elBal.classList.add('status-ok');
            } else {
                elBal.innerHTML = `<span>➕</span> LEBIH (+) Rp ` + selisih.toLocaleString('id-ID');
                elBal.classList.add('status-plus');
            }
            btn.innerHTML = `<span>💾</span> SIMPAN FINAL`;
            btn.className = "btn-action btn-green";
        }
        autoSaveDraft();
    }

    function collectDraftData() {
        return {
            tgl: document.getElementById('tgl').value,
            nama_toko: document.getElementById('nama_toko').value,
            total_sales: document.getElementById('total_sales').value,
            dataStore: dataStore,
            ekor_note: document.getElementById('val_nama_ekor').value,
            hiddenVals: {
                h_setor_sore: document.getElementById('h_setor_sore').value,
                h_setor_malam: document.getElementById('h_setor_malam').value,
                h_setor_pagi: document.getElementById('h_setor_pagi').value,
                h_ekor_sales: document.getElementById('h_ekor_sales').value,
                h_pot_ba: document.getElementById('h_pot_ba').value,
                h_pot_lebih: document.getElementById('h_pot_lebih').value,
                h_pot_virtual: document.getElementById('h_pot_virtual').value
            }
        };
    }

    function autoSaveDraft() {
        if (!currentStoreCode) return;
        const formData = new FormData();
        formData.append('action', 'save_draft');
        formData.append('Kode Toko', currentStoreCode);
        formData.append('draft_data', JSON.stringify(collectDraftData()));
        fetch(scriptURL, { method: 'POST', body: formData }).catch(e => console.log("Autosave err"));
    }

    function loadDraft() {
        const historyList = document.getElementById('historyList');
        document.getElementById('historyList').style.display = 'block';
        historyList.innerHTML = `🔄 Cek draf cloud...`;

        fetch(scriptURL + "?action=load_draft&kode=" + currentStoreCode + "&tmp=" + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    historyList.style.display = 'none';
                    dataStore = {}; initForm();
                } else {
                    const draft = data;
                    document.getElementById('tgl').value = draft.tgl || new Date().toISOString().substring(0, 10);
                    document.getElementById('total_sales').value = draft.total_sales || '';
                    document.getElementById('val_nama_ekor').value = draft.ekor_note || '';

                    if (typeof draft.dataStore === 'string') { try { dataStore = JSON.parse(draft.dataStore); } catch(e) { dataStore = {}; } } 
                    else { dataStore = draft.dataStore || {}; }

                    if (draft.hiddenVals) {
                        for (let k in draft.hiddenVals) { if(document.getElementById(k)) document.getElementById(k).value = draft.hiddenVals[k]; }
                    }

                    initForm(); 
                    if(document.getElementById('note_ekor')) document.getElementById('note_ekor').value = draft.ekor_note || '';
                    ['setor_sore', 'setor_malam', 'setor_pagi', 'ekor_sales', 'pot_ba', 'pot_lebih', 'pot_virtual'].forEach(id => {
                        let val = Number(document.getElementById('h_' + id).value) || 0;
                        if(document.getElementById('view_'+id)) document.getElementById('view_'+id).value = "Rp " + val.toLocaleString('id-ID');
                    });

                    hitungGlobal();
                    historyList.style.display = 'block';
                    historyList.innerHTML = `<span style="color:green; font-weight:bold;">✅ Draf Dipulihkan (${formatDateIndo(draft.tgl)})</span>`;
                }
            }).catch(e => { historyList.style.display = 'none'; initForm(); });
    }

    function confirmDeleteDraft() {
        showConfirm("Hapus Draf?", "Data draf akan dihapus.", true, function() {
            const form = new FormData(); form.append('action', 'delete_draft'); form.append('Kode Toko', currentStoreCode);
            fetch(scriptURL, { method: 'POST', body: form }).then(() => location.reload());
        });
    }

    function trySubmitForm() {
        let selisih = Number(document.getElementById('val_selisih').value);
        let msg = (selisih < 0) ? `Data MINUS Rp ${Math.abs(selisih).toLocaleString()}. Yakin?` : "Simpan laporan final?";
        
        showConfirm("Konfirmasi", msg, false, function() { processSubmit(); });
    }

    function processSubmit() {
        const btn = document.getElementById('btn-submit');
        const status = document.getElementById('status');
        btn.disabled = true; btn.innerText = "⏳ Mengirim...";
        
        const form = document.getElementById('salesForm');
        const formData = new FormData(form);
        formData.set('action', 'submit_final'); 
        formData.set('Total Sales', getCleanNumber(document.getElementById('total_sales').value));
        formData.set('Tanggal', formatDateIndo(document.getElementById('tgl').value)); 
        formData.set('Ket Ekor', document.getElementById('val_nama_ekor').value);
        formData.set('Pengirim', document.getElementById('nomor_pengirim').value);
        formData.set('Info Perangkat', document.getElementById('info_perangkat').value);
        formData.append('raw_rincian', JSON.stringify(dataStore));

        fetch(scriptURL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if (data.result === "success") {
                     status.innerText = "✅ Berhasil!"; 
                     btn.style.display = 'none'; document.getElementById('btn-wa').style.display = 'flex';
                     const delData = new FormData(); delData.append('action', 'delete_draft'); delData.append('Kode Toko', currentStoreCode);
                     fetch(scriptURL, { method: 'POST', body: delData }); 
                     showAlert("Berhasil!", "Laporan Tersimpan.");
                } else { throw new Error(data.error || "Gagal Unknown"); }
            })
            .catch(err => {
                status.innerText = "Gagal: " + err.message;
                btn.disabled = false; btn.innerText = "💾 SIMPAN FINAL";
                showAlert("Error", "Gagal mengirim data. Coba lagi.");
            });
    }

    function showAlert(title, msg) {
        document.getElementById('alertTitle').innerText = title;
        document.getElementById('alertMsg').innerText = msg;
        document.getElementById('alertModal').style.display = 'flex';
    }
    function showConfirm(title, msg, isDanger, callback) {
        document.getElementById('confirmTitle').innerText = title;
        document.getElementById('confirmMsg').innerText = msg;
        let btn = document.getElementById('btnConfirmYes');
        btn.className = isDanger ? "btn-modal-danger" : "btn-modal-primary";
        onConfirmAction = callback;
        document.getElementById('confirmModal').style.display = 'flex';
    }
    function closeConfirm() { document.getElementById('confirmModal').style.display = 'none'; }
    function doConfirmYes() { if (onConfirmAction) onConfirmAction(); closeConfirm(); }
    function formatDateIndo(dateString) { if (!dateString) return ""; let parts = dateString.split('-'); return (parts.length === 3) ? `${parts[2]}-${parts[1]}-${parts[0]}` : dateString; }
    
    
    function resetFormulir() {
        
        document.getElementById('total_sales').value = "";
        document.getElementById('tgl').value = new Date().toISOString().substring(0, 10);
        document.getElementById('val_nama_ekor').value = "";
        if(document.getElementById('note_ekor')) document.getElementById('note_ekor').value = "";

        
        dataStore = {}; 
        initForm(); // SEPTA GANTENG
        document.getElementById('status').innerText = "";
        
        
        document.getElementById('btn-wa').style.display = 'none';
        let btnSubmit = document.getElementById('btn-submit');
        btnSubmit.style.display = 'flex';
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = "<span>💾</span> SIMPAN FINAL";
    }

    function kirimWA() {
        let getVal = (id) => document.getElementById('view_'+id).value;
        let selisih = Number(document.getElementById('val_selisih').value);
        let statusTxt = (selisih === 0) ? "BALANCE OK ✅" : (selisih > 0 ? `LEBIH (+) Rp ${selisih.toLocaleString()}⚠️` : `KURANG (-) Rp ${Math.abs(selisih).toLocaleString()}⚠️`);
        
        let txt = `*LAPORAN SETOR SALES*\n*${currentStoreCode} - ${document.getElementById('nama_toko').value}*\n*Tgl:* ${formatDateIndo(document.getElementById('tgl').value)}\n*Total Sales:* Rp ${document.getElementById('total_sales').value}\n------------------\n*Fisik Setor:*\n1. Sore: ${getVal('setor_sore')}\n2. Malam: ${getVal('setor_malam')}\n3. Pagi: ${getVal('setor_pagi')}\n4. Ekor: ${getVal('ekor_sales')}\n------------------\n*Total Setor: ${document.getElementById('disp_total_fisik').innerText}*\n\n*${statusTxt}*`;
        
        
        window.open(`https://wa.me/6285183347653?text=${encodeURIComponent(txt)}`, '_blank');
        
        
        setTimeout(resetFormulir, 3000); 
    }
</script>
